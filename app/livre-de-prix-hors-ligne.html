}
// Verdict affiché en bout de ligne dès qu'un prix est saisi : c'est là qu'il sert,
// au moment où l'on peut encore refuser la marchandise ou appeler le fournisseur.
function receptionVerdictHTML(p, refPrice){
  if(!(refPrice>0)) return '<span class="hint">—</span>';
  const best = bestSupplierFor(p);
  const who = (ui.recSupplier && ui.recSupplier!=='all') ? ui.recSupplier : null;
  if(!best) return '<span class="pill pill-good">1er prix connu</span>';
  if(who && best.supplier.name===who && Math.abs(best.refPrice-refPrice)<1e-9) return '<span class="pill pill-good">meilleur prix</span>';
  const diff = (refPrice - best.refPrice) / best.refPrice * 100;
  if(diff <= -0.5) return `<span class="pill pill-good">− ${fmtNum(Math.abs(diff),0)} % vs ${esc(best.supplier.name)}</span>`;
  if(diff >= 0.5)  return `<span class="pill pill-critical">+ ${fmtNum(diff,0)} % vs ${esc(best.supplier.name)}</span>`;
  return '<span class="pill pill-neutral">même prix</span>';
}
function receptionEquivHTML(p, e){
  const bits = [];
  if(e.qty>0 && qtyFactor(p, e.qtyUnit)!==1) bits.push('= ' + fmtNum(e.qty,2) + ' ' + esc(stockUnitLabel(p)));
  const w = qtyWarning(p, e.qty);
  if(w) bits.push(`<span style="color:var(--warning);">${esc(w)}</span>`);
  return bits.join('<br>');
}

/* ================= Ventes du service =================
   Le pendant de la réception. On saisit combien de fois chaque fiche a été
   vendue ; l'appli en déduit ce qui doit sortir du stock, ingrédient par
   ingrédient, à partir des fiches techniques. C'est ce qui ferme la boucle
   entrée → sortie sans avoir à brancher la caisse.

   Un seul mouvement de stock par produit, agrégé : un service de 60 couverts
   créerait sinon des centaines de lignes illisibles dans l'historique. */
function salesCount(r){
  return (state.salesLog||[]).reduce((n,s)=> n + ((s.lines&&s.lines[r.id])||0), 0);
}
function salesEnteredIds(){
  const d = ui.salesDraft||{};
  return Object.keys(d).filter(id=>d[id]>0 && state.recipes.some(r=>r.id===id));
}
function salesRecipes(){
  const q = (ui.salesSearch||'').trim().toLowerCase();
  const entered = new Set(salesEnteredIds());
  let list = state.recipes.filter(r=>{
    if(entered.has(r.id)) return true;
    if(r.type!=='recette') return false;
    if(ui.salesCat!=='all' && r.category!==ui.salesCat) return false;
    if(q) return r.name.toLowerCase().includes(q);
    return isRecipeActive(r);
  });
  list.sort((a,b)=> salesCount(b)-salesCount(a) || a.name.localeCompare(b.name,'fr'));
  return list;
}
// Ce que la saisie en cours ferait sortir, agrégé par produit.
function salesDraftConsumption(){
  const byProduct = new Map();
  salesEnteredIds().forEach(rid=>{
    const r = state.recipes.find(x=>x.id===rid);
    const n = ui.salesDraft[rid];
    recipeConsumption(r).forEach(c=>{
      const cur = byProduct.get(c.product.id) || {product:c.product, qty:0};
      cur.qty += c.qty * n;
      byProduct.set(c.product.id, cur);
    });
  });
  return Array.from(byProduct.values()).sort((a,b)=>a.product.name.localeCompare(b.product.name,'fr'));
}
function salesSummaryHTML(){
  const ids = salesEnteredIds();
  if(!ids.length) return '';
  const cons = salesDraftConsumption();
  let value = 0, ca = 0, short = 0;
  cons.forEach(c=>{
    value += (valueForQty(c.product, c.qty)||0);
    if((c.product.stock_qty||0) < c.qty) short++;
  });
  ids.forEach(id=>{ const r = state.recipes.find(x=>x.id===id); ca += (r.pv_ttc||0) * ui.salesDraft[id]; });
  return `<div class="kpi-row" style="margin-top:14px;">
    <div class="card kpi"><div class="label">Fiches vendues</div><div class="value">${ids.reduce((n,id)=>n+ui.salesDraft[id],0)}</div><div class="note">sur ${ids.length} référence(s)</div></div>
    <div class="card kpi"><div class="label">Chiffre d’affaires</div><div class="value">${fmtMoney(ca)}</div><div class="note">TTC, d’après les prix de vente</div></div>
    <div class="card kpi"><div class="label">Sort du stock</div><div class="value">${fmtMoney(value)}</div><div class="note">${cons.length} produit(s) impactés</div></div>
    ${short?`<div class="card kpi"><div class="label">Stock insuffisant</div><div class="value" style="color:var(--critical);">${short}</div><div class="note">produit(s) passeraient en négatif</div></div>`:''}
  </div>`;
}

  return `

  <div id="sales-summary">${salesSummaryHTML()}</div>

  ${list.length ? `

  `;

/* ================= Contrôle des pertes =================
   La raison d'être de l'outil : tout le reste — fiches, prix d'achat,
   réceptions, inventaires — n'existe que pour rendre ce calcul possible.

       perte = ce qui a réellement disparu du stock
             − ce que les ventes auraient dû faire sortir

   Les deux termes sont déjà enregistrés, et il n'y a rien à ressaisir. Un
   inventaire validé porte, pour chaque produit, le stock théorique du moment
   (`theoretical_qty` : le stock de début de période, plus les réceptions,
   moins ce que les fiches vendues ont fait sortir) et ce qui a été compté dans
   les rayons (`counted_qty`). L'écart entre les deux EST la perte : casse,
   vol, surdosage, verre offert, erreur de comptage.

   MAIS il ne vaut que si la chaîne est complète. Un mois où personne n'a saisi
   les ventes produit un « écart » spectaculaire qui ne mesure rien d'autre que
   l'oubli. Afficher ce chiffre sans le dire ferait prendre une négligence de
   saisie pour du vol — c'est le pire service à rendre à un gérant. L'écran
   compte donc les produits sans aucune sortie enregistrée et le signale avant
   le chiffre, pas en note de bas de page. */

function validatedInventories(){
  return (state.inventories||[]).filter(i=>i.status==='validated')
    .sort((a,b)=> (b.date||'').localeCompare(a.date||''));
}
/* L'inventaire validé qui précède, SUR LE MÊME PÉRIMÈTRE : c'est lui qui fixe le
   début de la période. Comparer la cuisine au dernier comptage du bar donnerait
   une période fantaisiste et des pertes inventées. */
function previousInventory(inv){
  return (state.inventories||[])
    .filter(i=> i.status==='validated' && i.id!==inv.id
             && i.category===inv.category && (i.zone||'all')===(inv.zone||'all')
             && (i.date||'') < (inv.date||''))
    .sort((a,b)=> (b.date||'').localeCompare(a.date||''))[0] || null;
}
// Bornes : on exclut le jour du comptage précédent (son écart d'inventaire
// appartient à la période d'avant) et on inclut celui du comptage en cours.
function movementsBetween(p, fromDate, toDate){
  return (p.stock_movements||[]).filter(m=>{
    const d = m.date || '';
    if(toDate && d > toDate) return false;
    if(fromDate && d <= fromDate) return false;
    return true;
  });
}
function productUsedInRecipes(p){
  return state.recipes.some(r=>(r.ingredients||[]).some(i=>i.product_id===p.id));
}
function lossLine(inv, c, prev){
  const p = productById(c.product_id);
  if(!p || c.counted_qty==null) return null;
  let recu=0, sorti=0, ajust=0;
  movementsBetween(p, prev ? prev.date : null, inv.date).forEach(m=>{
    if(m.type==='reception')        recu  += m.qty;
    else if(m.type==='vente')       sorti += -m.qty;    // enregistrée en négatif
    else if(m.type==='ajustement')  ajust += m.qty;
  });
  // Le stock de début se retrouve en remontant la chaîne depuis le stock
  // théorique, plutôt qu'en relisant le comptage précédent : c'est vrai même
  // si un produit a été ajouté en cours de période.
  const debut  = round3(c.theoretical_qty - recu + sorti - ajust);
  const manque = round3(c.theoretical_qty - c.counted_qty);   // > 0 = il manque
  return {
    p, debut, recu:round3(recu), sorti:round3(sorti), ajust:round3(ajust),
    prevu: c.theoretical_qty, compte: c.counted_qty, manque,
    valeur: valueForQty(p, manque),
    sortiVal: valueForQty(p, sorti),
    // Un produit qui entre dans des fiches mais n'a aucune sortie sur la
    // période : ses ventes n'ont pas été saisies, son « écart » ne veut rien dire.
    ventesManquantes: sorti <= 1e-9 && productUsedInRecipes(p),
  };
}
function lossReport(inv){
  const prev  = previousInventory(inv);
  const lines = (inv.counts||[]).map(c=>lossLine(inv, c, prev)).filter(Boolean);
  const tot = {debut:0, recu:0, sorti:0, prevu:0, compte:0, valeur:0, sortiVal:0};
  lines.forEach(l=>{
    tot.debut += l.debut; tot.recu += l.recu; tot.sorti += l.sorti;
    tot.prevu += l.prevu; tot.compte += l.compte;
    tot.valeur += l.valeur; tot.sortiVal += l.sortiVal;
  });
  lines.sort((a,b)=> Math.abs(b.valeur) - Math.abs(a.valeur));
  return { inv, prev, lines, tot,
    sansVentes: lines.filter(l=>l.ventesManquantes).length,
    // Taux de perte : la part de ce qui est sorti du stock sans être vendu.
    // Plus parlant qu'un montant brut, qui dépend de la taille du mois.
    taux: tot.sortiVal > 0 ? tot.valeur / tot.sortiVal : null };
}

function viewLosses(){
  const invs = validatedInventories();
  if(!invs.length){
    return `<div class="card empty">
      <div class="big">${ico('gauge', 40)}</div>
      <h3>Pas encore de contrôle possible</h3>
      <p>Les pertes se mesurent entre deux inventaires. Dès qu’un inventaire est
         validé, le calcul apparaît ici — vous n’aurez rien à ressaisir.</p>
      <div style="margin-top:14px;"><button class="btn btn-primary" data-nav="inventory-list">Aller aux inventaires</button></div>
    </div>`;
  }
  const inv = invs.find(i=>i.id===ui.lossInv) || invs[0];
  const rep = lossReport(inv);
  const t   = rep.tot;
  const u   = l => esc(stockUnitLabel(l.p));

  const periode = rep.prev
    ? `du ${fmtDate(rep.prev.date)} au ${fmtDate(inv.date)}`
    : `jusqu’au ${fmtDate(inv.date)} (premier inventaire de ce périmètre)`;

  const selecteur = invs.length > 1 ? `
    <div class="field" style="max-width:420px;">
      <label>Inventaire de fin de période</label>
      <select data-onchange="lossInv">
        ${invs.map(i=>`<option value="${i.id}"${i.id===inv.id?' selected':''}>${fmtDate(i.date)} — ${esc(categoryLabel(i.category))}${i.zone&&i.zone!=='all'?' · '+esc(i.zone):''}</option>`).join('')}
      </select>
    </div>` : '';

  // Le chiffre est une perte quand il manque de la marchandise (valeur > 0).
  const perte   = t.valeur > 0;
  const heroCls = !rep.lines.length ? 'hero-neutral'
                : rep.sansVentes ? 'hero-neutral'
                : perte && rep.taux!=null && rep.taux > 0.05 ? 'hero-critical'

          <div class="hint" style="margin-top:4px;">
            ${rep.sansVentes} produit${rep.sansVentes>1?'s entrent':' entre'} dans vos fiches mais
            ${rep.sansVentes>1?'n’ont':'n’a'} enregistré aucune sortie sur la période : les ventes
            n’ont pas été saisies. L’écart mesuré est alors de la consommation normale, pas de la perte.
            Saisissez les ventes du mois, puis revenez ici.
          </div>

        </div>

  const chaine = `
    <div class="chain-grid" style="margin-top:14px;">
      <div class="metric-box"><div class="l">Stock de début</div><div class="v">${fmtMoney(valueTotalOf(rep.lines,'debut'))}</div></div>
      <div class="metric-box"><div class="l">+ Réceptions</div><div class="v">${fmtMoney(valueTotalOf(rep.lines,'recu'))}</div></div>
      <div class="metric-box"><div class="l">− Sorties des ventes</div><div class="v">${fmtMoney(t.sortiVal)}</div></div>
      <div class="metric-box"><div class="l">= Stock prévu</div><div class="v">${fmtMoney(valueTotalOf(rep.lines,'prevu'))}</div></div>
      <div class="metric-box"><div class="l">Stock compté</div><div class="v">${fmtMoney(valueTotalOf(rep.lines,'compte'))}</div></div>

  const lignes = rep.lines.filter(l=>Math.abs(l.manque) > 1e-9);

// Valorise un champ de quantité sur toutes les lignes — chaque produit a son
// propre prix, un total de quantités n'aurait aucun sens (des cl + des grammes).
function valueTotalOf(lines, champ){
  let s = 0;
  lines.forEach(l=>{ s += valueForQty(l.p, l[champ]) || 0; });
  return s;
}

/* ================= À vérifier =================
   Les arbitrages que l'import ne peut pas trancher parce qu'ils demandent de
   connaître le restaurant : combien de portions dans une préparation, si deux
   produits n'en font qu'un, ce que contient un carton de pailles.

   Chaque point reste affiché tant qu'il n'a pas été traité, et « c'est normal »
   est toujours une réponse valable : on le marque vérifié et il disparaît. */
const RECAP_LINE_RE = /^\s*(pr pour|recette\s|1 part|poids d|la portion|\(\s*r[ée]duit|total\b)/i;

function rawRecipeCost(r){
  let s = 0;
  (r.ingredients||[]).forEach(i=>{ s += liveIngredientPR(i); });
  return s;
}
// Préparations en lot dont le coût dépasse le prix de vente : le signe qu'on
// impute le bidon entier à une portion faute de rendement renseigné.
function hasLegacyCorrection(r){
  return r.batch_correction_pr!=null || r.batch_correction_prp!=null;
}
function reviewBatchNoYield(){
  return state.recipes.filter(r=> r.type==='recette' && r.pv_ttc>0
    && !(r.batch_yield>0) && !hasLegacyCorrection(r) && !r.yield_confirmed
    && rawRecipeCost(r) > r.pv_ttc);
}
// Facteurs de correction hérités de l'import : un nombre opaque (0,0164…) appliqué
// au coût pour retomber sur la bonne portion. Ça marche tant que personne ne touche
// à la fiche — mais dès qu'on ajoute ou retire un ingrédient, le facteur ne
// correspond plus à rien et le coût devient faux sans que ça se voie.
function reviewLegacyCorrection(){
  return state.recipes.filter(r=> r.type==='recette' && hasLegacyCorrection(r)
    && !(r.batch_yield>0) && !r.correction_confirmed);
}
function reviewRecapLines(){
  const out = [];
  state.recipes.forEach(r=>(r.ingredients||[]).forEach((ing,idx)=>{
    const p = productById(ing.product_id);
    if(p && RECAP_LINE_RE.test(p.name) && !ing.line_confirmed) out.push({r, ing, idx, p});
  }));
  return out;
}
function reviewMissingFormat(){
  return state.products.filter(p=>!p.base_unit && !p.format_confirmed);
}
function reviewOddPrice(){
  return state.products.filter(p=>{
    const c = currentPrice(p);
    return c!=null && c>200 && !p.price_confirmed;
  });
}
function normName(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
// Deux produits dont l'un porte exactement le nom de l'autre, suivi d'une
// précision (« citron jaune » / « citron jaune ( 1 citron 160 gr ) »).
function reviewDuplicates(){
  const list = state.products.map(p=>({p, k:normName(p.name)})).filter(x=>x.k.length>=12);
  list.sort((a,b)=>a.k.localeCompare(b.k));
  const out = [];
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      if(!list[j].k.startsWith(list[i].k)) break;
      if(list[j].k===list[i].k && list[j].p.id===list[i].p.id) continue;
      const pair = [list[i].p, list[j].p];
      const key = pair.map(x=>x.id).sort().join('|');
      if((state.settings.merge_dismissed||[]).includes(key)) continue;
      out.push({a:pair[0], b:pair[1], key});
    }
  }
  return out;
}
function reviewCounts(){
  return {
    yields: reviewBatchNoYield().length,
    legacy: reviewLegacyCorrection().length,
    recaps: reviewRecapLines().length,
    formats: reviewMissingFormat().length,
    dups: reviewDuplicates().length,
    prices: reviewOddPrice().length,
  };
}
function reviewTotal(){
  const c = reviewCounts();
  return c.yields + c.legacy + c.recaps + c.formats + c.dups + c.prices;
}
function usageCount(p){
  return state.recipes.reduce((n,r)=> n + (r.ingredients||[]).filter(i=>i.product_id===p.id).length, 0);
}

/* Regroupe deux produits en un seul. Rien n'est perdu : les lignes de fiche sont
   repointées, le stock est additionné via un mouvement tracé, les historiques de
   prix fusionnent par fournisseur, et les comptages d'inventaire suivent. */
function mergeProducts(keep, drop){
  state.recipes.forEach(r=>(r.ingredients||[]).forEach(i=>{
    if(i.product_id===drop.id) i.product_id = keep.id;
  }));
  (state.inventories||[]).forEach(inv=>(inv.counts||[]).forEach(c=>{
    if(c.product_id===drop.id) c.product_id = keep.id;
  }));
  if(drop.stock_qty){
    addStockMovement(keep, 'ajustement', drop.stock_qty,
      'Regroupement avec « ' + drop.name + ' »', todayISO());
  }
  keep.suppliers = keep.suppliers || [];
  (drop.suppliers||[]).forEach(s=>{
    const existing = keep.suppliers.find(x=>x.name===s.name);
    if(existing){
      existing.history = (existing.history||[]).concat(s.history||[])
        .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
    } else {
      keep.suppliers.push(s);
    }
  });
  if(!keep.family && drop.family) keep.family = drop.family;
  if(!keep.storage_zone && drop.storage_zone) keep.storage_zone = drop.storage_zone;
  if(!keep.base_unit && drop.base_unit){ keep.base_unit = drop.base_unit; keep.purchase_size = drop.purchase_size; }
  const idx = state.products.indexOf(drop);
  if(idx>=0) state.products.splice(idx,1);
}

/* ================= Premier lancement =================
   Trois écrans, pas un de plus : qui vous êtes, ce que vous servez, et les
   trois gestes qui font vivre l'application. Quelqu'un qui découvre l'outil
   doit comprendre en une minute ce qu'on attend de lui — sinon il referme.
   Réaffichable depuis les Réglages, parce qu'on recrute en cours d'année. */
function needsOnboarding(){
  return !(state.settings && state.settings.establishment_name);
}

  } else if(step===1){

function showOnboarding(step){
  ui.onbStep = step;
  document.getElementById('overlay-root').innerHTML = onboardingHTML(step);
  const form = document.getElementById('onb-form');
  form.addEventListener('submit', e=>{
    e.preventDefault();
    if(step===1){
      const v = (form.elements.establishment.value||'').trim();
      if(!v) return;
      state.settings.establishment_name = v;
    }
    if(step===2) saveOnboardingCategories(form);
    if(step<3){ scheduleSave(); showOnboarding(step+1); return; }
    closeOverlay(); scheduleSave(); render();
  });
}
// Renomme les catégories existantes, sans jamais changer leur identifiant :
// ce sont les produits et les fiches qui le portent.
function saveOnboardingCategories(form){
  form.querySelectorAll('[data-onb-cat]').forEach(inp=>{
    const c = categories()[parseInt(inp.dataset.onbCat,10)];
    const v = (inp.value||'').trim();
    if(c && v){ c.label = v; c.recipes_label = 'Fiches ' + v.toLowerCase(); }
  });
}

function viewReview(){
  const c = reviewCounts();
  if(!reviewTotal()){
    return `<div class="card empty"><div class="big">${ico('check', 40)}</div><h3>Rien à vérifier</h3>
      <p>Toutes les données importées ont été confirmées. Ce que vous saisissez au quotidien réapparaîtra ici si quelque chose cloche.</p></div>`;
  }

  const section = (title, count, intro, body)=> count ? `
    <div class="section">
      <div class="section-head"><h2>${title}</h2><span class="hint">${count} point(s)</span></div>
      <div class="hint" style="margin-bottom:10px;">${intro}</div>
      ${body}
    </div>` : '';

  // --- rendements de lot ---
  const yields = reviewBatchNoYield().map(r=>{
    const cost = rawRecipeCost(r);
    return `<tr>
      <td><a href="#" data-goto-recipe="${r.id}">${esc(r.name)}</a>
        <div class="hint">${esc(categoryLabel(r.category))} · coût saisi ${fmtMoney(cost)} · vendu ${fmtMoney(r.pv_ttc)}</div></td>
      <td class="num" style="white-space:nowrap;">
        <form data-form="review-yield" data-id="${r.id}" style="display:inline-flex;gap:6px;align-items:center;">

          <button type="submit" class="btn btn-sm btn-primary">Valider</button>
        </form>
      </td>
      <td class="num"><button class="btn btn-ghost btn-sm" data-action="review-yield-ok" data-id="${r.id}">Le coût est juste</button></td>
    </tr>`;}).join('');

  // --- lignes de récapitulatif ---
  const recaps = reviewRecapLines().map(({r,ing,idx,p})=>`
    <tr>
      <td><a href="#" data-goto-recipe="${r.id}">${esc(r.name)}</a>
        <div class="hint">ligne : « ${esc(p.name)} »${hasLegacyCorrection(r)&&!(r.batch_yield>0)?' · <span style="color:var(--warning);">cette fiche a un ancien facteur de correction : traitez-le d’abord</span>':''}</div></td>
      <td class="num">${fmtMoney(liveIngredientPR(ing))}<div class="hint" style="font-size:11px;">sur ${fmtMoney(rawRecipeCost(r))}</div></td>
      <td class="num" style="white-space:nowrap;">
        <button class="btn btn-sm" data-action="review-drop-line" data-rid="${r.id}" data-idx="${idx}">Retirer la ligne</button>
        <button class="btn btn-ghost btn-sm" data-action="review-keep-line" data-rid="${r.id}" data-idx="${idx}">C’est un vrai coût</button>
      </td>
    </tr>`).join('');

  // --- formats d'achat manquants (dont les consommables) ---
  const formats = reviewMissingFormat().map(p=>`
    <tr>
      <td><a href="#" data-goto-product="${p.id}">${esc(p.name)}</a>
        <div class="hint">${esc(categoryLabel(p.category))}${p.unit_label?' · format saisi : '+esc(p.unit_label):' · aucun format'} · utilisé dans ${usageCount(p)} fiche(s)</div></td>
      <td class="num" style="white-space:nowrap;">
        <form data-form="review-format" data-id="${p.id}" style="display:inline-flex;gap:6px;align-items:center;">
          <input type="text" inputmode="decimal" name="size" step="0.01" min="0.01" placeholder="contenu" style="width:88px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);">
          <select name="unit" style="padding:5px 7px;">
            <option value="unite">unités</option>
            <option value="g">g</option>
            <option value="cl">cl</option>
          </select>
          <button type="submit" class="btn btn-sm btn-primary">Valider</button>
        </form>
      </td>
      <td class="num"><button class="btn btn-ghost btn-sm" data-action="review-format-ok" data-id="${p.id}">Sans objet</button></td>
    </tr>`).join('');

  // --- doublons ---
  const dups = reviewDuplicates().map(({a,b,key})=>`

// Les produits qu'un inventaire de cette catégorie / zone doit couvrir.
function productsForInventory(category, zone){
  return state.products.filter(p=>{
    if(category && category!=='all' && p.category!==category && p.category!=='both') return false;
    if(zone && zone!=='all' && p.storage_zone!==zone) return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}
function inventoryCandidateProducts(inv){
  return productsForInventory(inv.category, inv.zone)
    .filter(p=>!inv.counts.some(c=>c.product_id===p.id));
}
function inventorySearchResultsHTML(inv){

    .filter(p=>p.name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name,'fr'))
    .slice(0,8);

    return `<div class="card no-print" style="padding:6px;margin-bottom:12px;">
      ${matches.map(p=>`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 10px;">

  </div>`;
}
/* Au comptage, un écart est une information utile — c'est même le but. Mais un
   écart d'un facteur 20 trahit presque toujours une unité confondue (compter des
   bouteilles là où le stock est en cl) plutôt qu'une perte réelle. On le signale
   sans jamais bloquer. */
function countWarning(p, counted, theoretical){
  if(counted==null || !(theoretical>0)) return null;
  const ratio = counted / theoretical;
  if(ratio >= 20)   return `⚠ ${fmtNum(ratio,0)}× le stock attendu — vérifier l’unité (${stockUnitLabel(p)})`;
  if(ratio <= 0.05) return `⚠ très en dessous du stock attendu — vérifier l’unité (${stockUnitLabel(p)})`;
  return null;
}
function inventoryTotalVarianceValue(inv){
  let total = 0;
  (inv.counts||[]).forEach(c=>{
    if(c.counted_qty==null) return;
    const p = productById(c.product_id);
    if(!p) return;
    total += (valueForQty(p, round3(c.counted_qty - c.theoretical_qty)) || 0);
  });
  return total;
}
// Même raison que pour la réception : sur une fiche pré-remplie de 176 lignes, un
// render() par quantité saisie détruirait l'input en cours et casserait la tabulation.
// On ne retouche que l'écart de la ligne, le compteur et le total.
function refreshInventoryRow(inputEl, inv, c){
  const p = productById(c.product_id);
  const tr = inputEl.closest('tr');
  if(p && tr && tr.children.length>=6){
    const variance = c.counted_qty!=null ? round3(c.counted_qty - c.theoretical_qty) : null;
    const varValue = variance!=null ? valueForQty(p, variance) : null;
    tr.children[4].innerHTML = variance!=null
      ? `<span class="trend ${variance>0.0001?'up':variance<-0.0001?'down':'flat'}">${variance>0?'+':''}${fmtNum(variance,2)}</span>`
      : '—';
    tr.children[5].innerHTML = varValue!=null ? fmtMoney(varValue) : '—';
  }
  const warn = inputEl.parentElement && inputEl.parentElement.querySelector('[data-count-warn]');
  if(warn && p) warn.textContent = countWarning(p, c.counted_qty, c.theoretical_qty) || '';
  const prog = document.getElementById('inv-progress');
  if(prog) prog.textContent = String((inv.counts||[]).filter(x=>x.counted_qty!=null).length);
  const tot = document.getElementById('inv-total-variance');
  if(tot) tot.textContent = fmtMoney(inventoryTotalVarianceValue(inv));
}
function viewInventoryDetail(id, actionsEl){
  const inv = (state.inventories||[]).find(x=>x.id===id);
  if(!inv) return `<div class="empty">Inventaire introuvable.</div>`;
  const inProgress = inv.status==='in_progress';
  if(actionsEl){
    if(inProgress){
      actionsEl.innerHTML = `
        <button class="btn btn-danger btn-sm" data-action="delete-inventory" data-id="${inv.id}">Supprimer</button>
        <button class="btn btn-primary btn-sm" data-action="validate-inventory" data-id="${inv.id}">✓ Valider l’inventaire</button>`;
    } else {
      actionsEl.innerHTML = `<button class="btn btn-sm" data-action="print-inventory" data-id="${inv.id}">${ico('printer',16)} Imprimer</button>`;
    }
  }
  const catLabel = categoryLabel(inv.category);
  const zoneLabel = inv.zone && inv.zone!=='all' ? inv.zone : null;
  // Inventaires validés antérieurs à celui-ci (toutes zones confondues), du plus récent
  // au plus ancien — pour afficher, produit par produit, le dernier « Réel » compté par
  // l'équipe le mois précédent et comparer visuellement l'avant/après d'un mois sur l'autre.
  const priorInvs = (state.inventories||[])
    .filter(x => x.id!==inv.id && x.status==='validated' &&
      ((x.date||'') < (inv.date||'') || ((x.date||'')===(inv.date||'') && (x.validated_at||'') < (inv.validated_at||''))))
    .sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.validated_at||'').localeCompare(a.validated_at||''));
  function previousReal(productId){
    for(const pinv of priorInvs){
      const c = (pinv.counts||[]).find(cc=>cc.product_id===productId && cc.counted_qty!=null);
      if(c) return {qty:c.counted_qty, date:pinv.date};
    }
    return null;
  }
  let totalVarValue = 0;
  const rows = inv.counts.map((c,idx)=>{
    const p = productById(c.product_id);
    if(!p) return null;
    const variance = c.counted_qty!=null ? round3(c.counted_qty - c.theoretical_qty) : null;
    const varValue = variance!=null ? valueForQty(p, variance) : null;
    if(varValue!=null) totalVarValue += varValue;
    const prev = previousReal(p.id);
    return {p, c, idx, variance, varValue, prev};
  }).filter(Boolean);
  // Regroupées par zone de stockage (à défaut par famille) pour suivre l'ordre de la
  // marche physique dans les réserves/chambres froides, comme sur les fiches papier.
  const mode = ui.invGroupBy || 'auto';
  const groupNameFor = p =>
    mode==='zone'   ? (p.storage_zone || 'Sans zone de rangement') :
    mode==='family' ? (p.family || 'Sans famille') :
    mode==='none'   ? 'Tous les produits' :
                      (p.family || p.storage_zone || 'Non classé');
  const groups = {};
  const groupOrder = [];
  rows.forEach(row=>{
    const g = groupNameFor(row.p);
    if(!groups[g]){ groups[g] = []; groupOrder.push(g); }
    groups[g].push(row);
  });
  const isCatchAll = n => n==='Non classé' || n==='Sans famille' || n==='Sans zone de rangement';
  groupOrder.sort((a,b)=> isCatchAll(a) ? 1 : isCatchAll(b) ? -1 : a.localeCompare(b,'fr'));
  const rowHTML = ({p,c,idx,variance,varValue,prev})=>`
        <tr>
          <td>${esc(p.name)}</td>
          <td class="num">${prev
            ? `${fmtNum(prev.qty,2)} ${esc(stockUnitLabel(p))}<div class="hint" style="font-size:11px;">${fmtDate(prev.date)}</div>`
            : '<span class="hint">— premier inventaire</span>'}</td>
          <td class="num">${fmtNum(c.theoretical_qty,2)} ${esc(stockUnitLabel(p))}</td>
          <td class="num">${inProgress
            ? `<input class="num" style="width:90px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:var(--surface);" type="text" inputmode="decimal" value="${c.counted_qty!=null?c.counted_qty:''}" data-inventory-count="${inv.id}:${idx}">
               <div class="hint" style="font-size:11px;color:var(--warning);" data-count-warn="${inv.id}:${idx}">${esc(countWarning(p, c.counted_qty, c.theoretical_qty)||'')}</div>`
            : (c.counted_qty!=null?fmtNum(c.counted_qty,2):'—')}</td>
          <td class="num">${variance!=null?`<span class="trend ${variance>0.0001?'up':variance<-0.0001?'down':'flat'}">${variance>0?'+':''}${fmtNum(variance,2)}</span>`:'—'}</td>
          <td class="num">${varValue!=null?fmtMoney(varValue):'—'}</td>
          ${inProgress?`<td class="num no-print"><button type="button" class="btn btn-ghost btn-sm" data-action="remove-product-from-inventory" data-inv="${inv.id}" data-pid="${p.id}" title="Retirer du comptage">✕</button></td>`:''}
        </tr>`;
  const counted = inv.counts.filter(c=>c.counted_qty!=null).length;
  const progressBlock = rows.length ? `
    <div class="hint no-print" style="margin-top:12px;">
      <strong id="inv-progress">${counted}</strong> produit(s) comptés sur ${rows.length}.
      ${inProgress ? 'Les lignes laissées vides seront ignorées à la validation — le stock ne bougera pas pour ces produits.' : ''}
    </div>` : '';
  const groupSelect = rows.length ? `
      <div class="field" style="max-width:260px;margin:0;">
        <label>Ranger par</label>
        <select data-onchange="invGroupBy">
          <option value="auto"   ${mode==='auto'?'selected':''}>Automatique (famille, sinon zone)</option>
          <option value="family" ${mode==='family'?'selected':''}>Famille</option>
          <option value="zone"   ${mode==='zone'?'selected':''}>Zone de rangement</option>
          <option value="none"   ${mode==='none'?'selected':''}>Une seule liste, par ordre alphabétique</option>
        </select>
      </div>` : '';
  const searchBlock = `
    <div class="toolbar no-print" style="margin-top:16px;align-items:flex-end;">
      ${inProgress ? `<div class="search"><input type="text" placeholder="Ajouter un produit absent de la liste…" value="${esc(ui.invSearch||'')}" data-oninput="invSearch"></div>` : ''}
      ${groupSelect}
    </div>
    ${inProgress ? inventorySearchResultsHTML(inv) : ''}
    ${progressBlock}

function sparkline(history){
  if(!history || history.length<2) return '<div class="hint">Pas encore assez de points pour un graphique.</div>';
  const w=520,h=100,pad=10;
  const prices = history.map(hh=>hh.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = (max-min) || (max*0.1) || 1;
  const step = (w-pad*2)/(history.length-1);
  const yFor = (price) => pad + (1-((price-min)/range)) * (h-pad*2);
  const coords = history.map((hh,i)=> [pad+i*step, yFor(hh.price)]);
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${coords[coords.length-1][0].toFixed(1)},${h-pad} L${coords[0][0].toFixed(1)},${h-pad} Z`;
  const last = coords[coords.length-1];
  return `<svg class="spark-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;max-width:${w}px;height:${h}px;">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)" stroke-width="1"/>
    <path d="${areaPath}" fill="var(--accent-wash)" opacity="0.6"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="2.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="var(--accent)"/>
  </svg>`;
}

/* ================= Suggestions de commande ================= */
function suggestedOrderQty(p){
  const thr = p.stock_low_threshold;
  if(thr==null) return null;
  const target = thr*2;
  const need = target - (p.stock_qty||0);
  return need>0 ? round3(need) : 0;
}
function viewOrders(){
  const low = state.products.filter(p=>isLowStock(p));
  if(!low.length){
    return `<div class="card empty"><div class="big">${ico('cart', 40)}</div><h3>Aucune suggestion de commande</h3><p>Aucun produit n’est actuellement sous son seuil de stock bas. Définissez des seuils depuis la fiche produit ou la vue Stock pour activer les suggestions.</p></div>`;
  }
  const bySupplier = new Map();
  low.forEach(p=>{
    const sup = primarySupplier(p);
    const name = sup ? sup.name : 'Fournisseur non renseigné';
    if(!bySupplier.has(name)) bySupplier.set(name, []);
    bySupplier.get(name).push(p);
  });
  const supplierNames = Array.from(bySupplier.keys()).sort((a,b)=>a.localeCompare(b,'fr'));
  let grandTotal = 0;
  const sections = supplierNames.map(name=>{
    const prods = bySupplier.get(name).slice().sort((a,b)=>a.name.localeCompare(b.name,'fr'));
    let supTotal = 0;
    const rows = prods.map(p=>{
      const qty = suggestedOrderQty(p);
      const cp = currentPrice(p);
      const lineTotal = (qty!=null && cp!=null) ? valueForQty(p, qty) : 0;
      supTotal += lineTotal;
      const usedIn = recipesUsingProduct(p.id).length;
      return `<tr>
        <td><a href="#" data-goto-product="${p.id}">${esc(p.name)}</a></td>
        <td>${esc(categoryLabel(p.category))}</td>
        <td class="num">${fmtNum(p.stock_qty||0,2)} ${esc(stockUnitLabel(p))}</td>
        <td class="num">${p.stock_low_threshold!=null?fmtNum(p.stock_low_threshold,2):'—'}</td>
        <td class="num">${qty!=null?fmtNum(qty,2)+' '+esc(stockUnitLabel(p)):'—'}</td>
        <td class="num">${fmtMoney(cp)}</td>
        <td class="num">${fmtMoney(lineTotal)}</td>
        <td class="num">${usedIn}</td>
      </tr>`;
    }).join('');
    grandTotal += supTotal;
    return `
    <div class="section">
      <div class="section-head"><h2>${esc(name)}</h2><span class="hint">${prods.length} produit(s) · total estimé ${fmtMoney(supTotal)}</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Produit</th><th>Catégorie</th><th class="num">Stock actuel</th><th class="num">Seuil bas</th><th class="num">Qté suggérée</th><th class="num">Prix unitaire</th><th class="num">Coût estimé</th><th class="num">Utilisé dans</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('');
  return `
  <div class="kpi-row">
    <div class="card kpi"><div class="label">Produits sous le seuil</div><div class="value" style="color:var(--critical);">${low.length}</div><div class="note">répartis sur ${supplierNames.length} fournisseur(s)</div></div>
    <div class="card kpi"><div class="label">Coût total estimé</div><div class="value">${fmtMoney(grandTotal)}</div><div class="note">pour ramener le stock à 2× le seuil bas de chaque produit</div></div>
  </div>
  ${sections}
  `;
}

// Garde --vvh alignée sur la hauteur réellement visible (visualViewport) : sur mobile,
// l'ouverture du clavier virtuel pour saisir un champ rétrécit la zone visible sans changer
// 100vh, ce qui peut pousser le bouton "Enregistrer" d'une modale hors d'atteinte. On
// resynchronise à l'ouverture d'une modale/tiroir et à chaque changement du clavier.
function syncViewportHeightVar(){
  const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  document.documentElement.style.setProperty('--vvh', h + 'px');
}
syncViewportHeightVar();
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', syncViewportHeightVar);
  window.visualViewport.addEventListener('scroll', syncViewportHeightVar);
}
window.addEventListener('resize', syncViewportHeightVar);
function closeOverlay(){ document.getElementById('overlay-root').innerHTML=''; }
function openDrawer(html){
  syncViewportHeightVar();
  document.getElementById('overlay-root').innerHTML = `<div class="overlay" data-action="overlay-bg"><div class="drawer" data-stop>${html}</div></div>`;
}
function openModal(html){
  syncViewportHeightVar();
  document.getElementById('overlay-root').innerHTML = `<div class="overlay center" data-action="overlay-bg"><div class="modal" data-stop>${html}</div></div>`;
}

/* ================= Event delegation ================= */
function closeMobileNav(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');
}
function toggleMobileNav(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}
document.getElementById('menu-toggle').addEventListener('click', toggleMobileNav);
document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileNav);

document.addEventListener('click', function(e){
  // Info-bulles : un tap sur le ⓘ l'ouvre/le ferme (pas de survol sur tablette tactile) ;
  // un tap ailleurs referme celles qui étaient ouvertes.
  const tipHit = e.target.closest('.info-tip');
  document.querySelectorAll('.info-tip.show').forEach(el=>{ if(el!==tipHit) el.classList.remove('show'); });
  if(tipHit){ tipHit.classList.toggle('show'); e.stopPropagation(); return; }

  const nav = e.target.closest('[data-nav]');
  if(nav){ closeMobileNav(); if(nav.dataset.nav==='margins') ui.marginFilter='all'; setView(nav.dataset.nav); return; }

  const back = e.target.closest('[data-action="back"]');
  if(back){ setView(back.dataset.view); return; }

  const insideRowStop = e.target.closest('td[data-stop]');

  const gotoRecipe = !insideRowStop && e.target.closest('[data-goto-recipe]');
  if(gotoRecipe){ setView('recipe-detail', gotoRecipe.dataset.gotoRecipe); return; }

  const gotoProduct = !insideRowStop && e.target.closest('[data-goto-product]');
  if(gotoProduct){ e.preventDefault(); setView('product-detail', gotoProduct.dataset.gotoProduct); return; }

  const gotoInventory = !insideRowStop && e.target.closest('[data-goto-inventory]');
  if(gotoInventory){ setView('inventory-detail', gotoInventory.dataset.gotoInventory); return; }

  const gotoSupplier = !insideRowStop && e.target.closest('[data-goto-supplier]');
  if(gotoSupplier){ ui.fournisseurFilter = gotoSupplier.dataset.gotoSupplier; ui.search = ''; setView('products'); return; }

  const bg = e.target.closest('[data-action="overlay-bg"]');
  if(bg && !e.target.closest('[data-stop]')){ closeOverlay(); return; }

  const closeBtn = e.target.closest('[data-action="close"]');
  if(closeBtn){ closeOverlay(); return; }

  const act = e.target.closest('[data-action]');
  if(!act) return;
  const a = act.dataset.action;

  if(a==='export-backup') return exportBackup();
  if(a==='trigger-import') return document.getElementById('import-file-input').click();
  if(a==='toggle-nav-more'){ ui.navMore = !ui.navMore; renderNav(); return; }
  if(a==='view-atrisk'){ ui.marginFilter='atRisk'; setView('margins'); return; }
  if(a==='reset-margin-filter'){ ui.marginFilter='all'; render(); return; }
  if(a==='new-product') return modalNewProduct();
  if(a==='add-supplier-price') return modalAddSupplierPrice(act.dataset.id, act.dataset.sid);
  if(a==='new-supplier') return modalNewSupplier(act.dataset.id);
  if(a==='rename-supplier') return modalRenameSupplier(act.dataset.id, act.dataset.sid);
  if(a==='edit-product-meta') return modalEditProductMeta(act.dataset.id);
  if(a==='new-recipe') return modalNewRecipe(act.dataset.cat);
  if(a==='edit-recipe-meta') return modalEditRecipeMeta(act.dataset.id);
  if(a==='add-ingredient') return modalAddIngredient(act.dataset.rid);
  if(a==='edit-ingredient') return modalEditIngredient(act.dataset.rid, parseInt(act.dataset.idx,10));
  if(a==='print-recipe'){ setView('recipe-detail', act.dataset.id); setTimeout(()=>window.print(), 120); return; }
  if(a==='print-batch'){ setView('print-batch', act.dataset.cat||'all'); return; }
  if(a==='do-print'){ window.print(); return; }
  if(a==='stock-movement') return modalStockMovement(act.dataset.id);
  if(a==='stock-settings') return modalStockSettings(act.dataset.id);
  if(a==='delete-category'){
    const idx = parseInt(act.dataset.idx,10);
    const c = categories()[idx];
    if(!c) return;
    if(categories().length<=1){ alert('Il faut au moins une catégorie.'); return; }
    const used = state.products.filter(p=>p.category===c.id).length + state.recipes.filter(r=>r.category===c.id).length;
    if(used){
      alert(`« ${c.label} » contient encore ${used} produit(s)/fiche(s). Déplacez-les vers une autre catégorie avant de la supprimer.`);
      return;
    }
    if(!confirm(`Supprimer la catégorie « ${c.label} » ?`)) return;
    state.settings.categories.splice(idx,1);
    if(ui.view===recipesViewId(c.id) || ui.view===catalogueViewId(c.id)) ui.view='dashboard';
    scheduleSave(); render(); return;
  }
  if(a==='recipe-photo'){
    ui.photoTarget = act.dataset.rid;
    const inp = document.getElementById('recipe-photo-input');
    if(inp){ inp.value = ''; inp.click(); }
    return;
  }
  if(a==='recipe-photo-remove'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    if(!r || !confirm('Retirer la photo de cette fiche ?')) return;
    delete r.photo;
    scheduleSave(); render(); return;
  }
  if(a==='onb-back'){ showOnboarding(Math.max(0, (ui.onbStep||0)-1)); return; }
  if(a==='onb-add-cat'){
    const form = document.getElementById('onb-form');
    if(form) saveOnboardingCategories(form);
    const label = 'Nouvelle activité';
    const base = 'activite'; let id = base, n = 2;
    while(categories().some(c=>c.id===id)) id = base + '-' + (n++);
    state.settings.categories.push({id, label, ico:'clipboard', recipes_label:'Fiches '+label.toLowerCase(), has_catalogue:false, catalogue_label:''});
    showOnboarding(2); return;
  }
  if(a==='onb-remove-cat'){
    const form = document.getElementById('onb-form');
    if(form) saveOnboardingCategories(form);
    const idx = parseInt(act.dataset.idx,10);
    const c = categories()[idx];
    if(c && categories().length>1){
      const used = state.products.filter(p=>p.category===c.id).length + state.recipes.filter(r=>r.category===c.id).length;
      if(used && !confirm(`« ${c.label} » contient ${used} élément(s). Les retirer de la liste les rendra invisibles. Continuer ?`)) return;
      state.settings.categories.splice(idx,1);
    }
    showOnboarding(2); return;
  }
  if(a==='show-onboarding'){ showOnboarding(0); return; }
  if(a==='review-correction-ok'){
    const r = state.recipes.find(x=>x.id===act.dataset.id);
    if(r){ r.correction_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-yield-ok'){
    const r = state.recipes.find(x=>x.id===act.dataset.id);
    if(r){ r.yield_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-drop-line'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    const idx = parseInt(act.dataset.idx,10);
    if(!r || !r.ingredients[idx]) return;
    const before = rawRecipeCost(r);
    r.ingredients.splice(idx,1);
    const after = rawRecipeCost(r);
    scheduleSave(); render();
    setSaveIndicator('pending', `Coût recalculé : ${fmtMoney(before)} → ${fmtMoney(after)}`);
    return;
  }
  if(a==='review-keep-line'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    const ing = r && r.ingredients[parseInt(act.dataset.idx,10)];
    if(ing){ ing.line_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-format-ok'){
    const p = productById(act.dataset.id);
    if(p){ p.format_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-price-ok'){
    const p = productById(act.dataset.id);
    if(p){ p.price_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-keep-both'){
    state.settings.merge_dismissed = state.settings.merge_dismissed || [];
    if(!state.settings.merge_dismissed.includes(act.dataset.key)) state.settings.merge_dismissed.push(act.dataset.key);
    scheduleSave(); render();
    return;
  }
  if(a==='review-merge'){
    const keep = productById(act.dataset.keep), drop = productById(act.dataset.drop);
    if(!keep || !drop) return;
    if(!confirm(`Regrouper « ${drop.name} » dans « ${keep.name} » ?\n\nLes fiches, le stock et l’historique des prix seront reportés. Cette opération peut changer le coût des fiches concernées.`)) return;
    mergeProducts(keep, drop);
    scheduleSave(); render();
    return;
  }
  if(a==='sales-clear'){
    if(!salesEnteredIds().length) return;
    if(!confirm('Effacer la saisie en cours ? Le stock n’a pas encore été modifié.')) return;
    ui.salesDraft = {}; render(); return;
  }
  if(a==='sales-save'){
    const ids = salesEnteredIds();
    if(!ids.length) return;
    const date = ui.salesDate || todayISO();
    const cons = salesDraftConsumption();
    const total = ids.reduce((n,id)=>n+ui.salesDraft[id],0);
    const negatives = cons.filter(c=>(c.product.stock_qty||0) < c.qty).length;
    let msg = `Enregistrer ${total} vente(s) du ${fmtDate(date)} ? ${cons.length} produit(s) seront déduits du stock.`;
    if(negatives) msg += `\n\nAttention : ${negatives} produit(s) passeront en stock négatif — signe d'une réception oubliée ou d'un inventaire à refaire.`;
    if(!confirm(msg)) return;
    const label = `Ventes du ${fmtDate(date)} (${total} fiche(s))`;
    cons.forEach(c=>{ addStockMovement(c.product, 'vente', -Math.abs(c.qty), label, date); });
    state.salesLog = state.salesLog || [];
    state.salesLog.push({ id: uid('sale'), date, lines: clone(ui.salesDraft) });
    ui.salesDraft = {};
    scheduleSave(); render();
    return;
  }
  if(a==='reception-pick-supplier'){
    // Choisir le fournisseur depuis la recherche : on vide la recherche pour
    // basculer aussitôt sur sa liste habituelle, qui est le but recherché.
    ui.recSupplier = act.dataset.name;
    ui.recSearch = '';
    render(); return;
  }
  if(a==='reception-clear'){
    if(!receptionEnteredIds().length) return;
    if(!confirm('Effacer toute la saisie en cours ? Le stock n’a pas encore été modifié.')) return;
    ui.recDraft = {}; render(); return;
  }
  if(a==='reception-save'){
    const ids = receptionEnteredIds();
    if(!ids.length) return;
    const date = ui.recDate || todayISO();
    const who = ui.recSupplier;
    const withPrice = ids.filter(id=>ui.recDraft[id].price>0);
    if(withPrice.length && (!who || who==='all')){
      alert('Choisissez le fournisseur qui a livré avant d’enregistrer : un prix ne veut rien dire sans lui.');
      return;
    }
    const parts = [];
    const withQty = ids.filter(id=>ui.recDraft[id].qty>0);
    if(withQty.length) parts.push(`${withQty.length} quantité(s) ajoutée(s) au stock`);
    if(withPrice.length) parts.push(`${withPrice.length} prix enregistré(s) pour ${who}`);
    let msg = `Réception du ${fmtDate(date)} : ${parts.join(' et ')} ?`;
    // Dernier rappel des quantités inhabituelles : c'est le moment où l'on peut
    // encore corriger sans avoir à défaire un mouvement de stock.
    const odd = ids.map(id=>({p:productById(id), w:qtyWarning(productById(id), ui.recDraft[id].qty)}))
                   .filter(x=>x.w);
    if(odd.length){
      msg += '\n\nÀ vérifier avant de valider :\n' + odd.map(x=>`• ${x.p.name} — ${x.w.replace('⚠ ','')}`).join('\n');
    }
    if(!confirm(msg)) return;
    ids.forEach(id=>{
      const p = productById(id);
      const e = ui.recDraft[id];
      if(e.qty>0) addStockMovement(p, 'reception', Math.abs(e.qty), 'Réception du '+fmtDate(date), date);
      if(e.price>0){
        // Le prix saisi est au kilo/litre/unité ; on le reconvertit au format d'achat,
        // seule forme comprise par le reste de l'appli.
        const packPrice = round3(refToPackPrice(p, e.price));
        p.suppliers = p.suppliers || [];
        let sup = p.suppliers.find(s=>s.name===who);
        if(!sup){
          sup = { id: uid('s'), name: who, history: [] };
          p.suppliers.push(sup);
        }
        sup.history = sup.history || [];
        const last = sup.history[sup.history.length-1];
        // La quantité est conservée avec le prix : c'est elle qui rend la
        // moyenne pondérée possible, et donc les coûts stables.
        sup.history.push({ date, price: packPrice, qty: e.qty>0 ? e.qty : null, note: 'Saisi en réception' });
        if(!p.primary_supplier_id) p.primary_supplier_id = sup.id;
      }
    });
    ui.recDraft = {};
    scheduleSave(); render();
    return;
  }
  if(a==='new-inventory') return modalNewInventory();
  if(a==='print-inventory'){ setView('inventory-detail', act.dataset.id); setTimeout(()=>window.print(), 120); return; }
  if(a==='validate-inventory'){
    const inv = (state.inventories||[]).find(x=>x.id===act.dataset.id);
    if(!inv || inv.status!=='in_progress') return;
    const uncounted = inv.counts.filter(c=>c.counted_qty==null).length;
    if(uncounted>0 && !confirm(uncounted+' produit(s) non compté(s) seront ignorés (stock inchangé). Valider quand même ?')) return;
    inv.counts.forEach(c=>{
      if(c.counted_qty==null) return;
      const p = productById(c.product_id);
      if(!p) return;
      const variance = round3(c.counted_qty - c.theoretical_qty);
      if(Math.abs(variance)>1e-9){
        addStockMovement(p, 'inventaire', variance, 'Écart inventaire du '+fmtDate(inv.date), inv.date);
      } else {
        p.stock_qty = c.counted_qty;
      }
    });
    inv.status = 'validated'; inv.validated_at = todayISO();
    scheduleSave(); render(); return;
  }
  if(a==='delete-inventory'){
    const idx = (state.inventories||[]).findIndex(x=>x.id===act.dataset.id);
    if(idx<0) return;
    if(!confirm('Supprimer cet inventaire (comptage non enregistré) ?')) return;
    state.inventories.splice(idx,1);
    closeOverlay(); scheduleSave(); setView('inventory-list'); return;
  }
  if(a==='add-product-to-inventory'){
    const inv = (state.inventories||[]).find(x=>x.id===act.dataset.inv);
    const p = productById(act.dataset.pid);
    if(inv && p && inv.status==='in_progress' && !inv.counts.some(c=>c.product_id===p.id)){
      inv.counts.push({ product_id:p.id, theoretical_qty: p.stock_qty||0, counted_qty:null });
      ui.invSearch = '';
      scheduleSave(); render();
    }
    return;
  }
  if(a==='remove-product-from-inventory'){
    const inv = (state.inventories||[]).find(x=>x.id===act.dataset.inv);
    if(inv && inv.status==='in_progress'){
      const idx = inv.counts.findIndex(c=>c.product_id===act.dataset.pid);
      if(idx>=0){ inv.counts.splice(idx,1); scheduleSave(); render(); }
    }
    return;
  }
  if(a==='quick-new-product-inventory'){ return modalNewProduct(act.dataset.inv, ui.invSearch); }

  if(a==='toggle-allergen'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    const code = act.dataset.code;
    r.allergens = r.allergens || [];
    const i = r.allergens.indexOf(code);
    if(i>=0) r.allergens.splice(i,1); else r.allergens.push(code);
    scheduleSave(); render(); return;
  }
  if(a==='delete-supplier-price'){
    const p = productById(act.dataset.id);
    const s = p.suppliers.find(x=>x.id===act.dataset.sid);
    const idx = parseInt(act.dataset.idx,10);
    if(!s || s.history.length<=1) return;
    if(!confirm('Supprimer ce point de prix historique ?')) return;
    s.history.splice(idx,1);
    scheduleSave(); render(); return;
  }
  if(a==='set-primary-supplier'){
    const p = productById(act.dataset.id);
    p.primary_supplier_id = act.dataset.sid;
    scheduleSave(); render(); return;
  }
  if(a==='delete-supplier'){
    const p = productById(act.dataset.id);
    if(p.suppliers.length<=1) return;
    if(!confirm('Supprimer ce fournisseur et son historique de prix pour ce produit ?')) return;
    const idx = p.suppliers.findIndex(x=>x.id===act.dataset.sid);
    if(idx<0) return;
    p.suppliers.splice(idx,1);
    if(p.primary_supplier_id===act.dataset.sid){ p.primary_supplier_id = p.suppliers[0].id; }
    scheduleSave(); render(); return;
  }
  if(a==='delete-ingredient'){
    if(!confirm('Retirer cet ingrédient de la recette ?')) return;
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    r.ingredients.splice(parseInt(act.dataset.idx,10),1);
    closeOverlay(); scheduleSave(); render(); return;
  }
  if(a==='delete-recipe'){
    if(!confirm('Supprimer définitivement cette fiche ?')) return;
    const idx = state.recipes.findIndex(x=>x.id===act.dataset.id);
    const cat = state.recipes[idx].category;
    state.recipes.splice(idx,1);
    closeOverlay(); scheduleSave(); setView(recipesViewId(cat)); return;
  }
  if(a==='delete-product'){
    const used = recipesUsingProduct(act.dataset.id);
    if(used.length){ alert('Impossible de supprimer : ce produit est utilisé dans ' + used.length + ' recette(s). Retirez-le des recettes d’abord.'); return; }
    if(!confirm('Supprimer définitivement ce produit ?')) return;
    const idx = state.products.findIndex(x=>x.id===act.dataset.id);
    state.products.splice(idx,1);
    closeOverlay(); scheduleSave(); setView('products'); return;
  }
  if(a==='delete-storage-zone'){
    const idx = parseInt(act.dataset.idx,10);
    const zone = (state.settings.storage_zones||[])[idx];
    if(zone!=null){
      const inUse = state.products.some(p=>p.storage_zone===zone);
      if(inUse && !confirm(`Des produits utilisent encore la zone “${zone}” — la supprimer de la liste ne les déclasse pas. Continuer ?`)) return;
      state.settings.storage_zones.splice(idx,1);
      scheduleSave(); render();
    }
    return;
  }
});

document.addEventListener('input', function(e){
  const t = e.target;
  if(t.matches('[data-oninput="search"]')){ ui.search = t.value; render(); const el=document.querySelector('[data-oninput="search"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="stockSearch"]')){ ui.stockSearch = t.value; render(); const el=document.querySelector('[data-oninput="stockSearch"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="invSearch"]')){ ui.invSearch = t.value; render(); const el=document.querySelector('[data-oninput="invSearch"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="salesSearch"]')){ ui.salesSearch = t.value; render(); const el=document.querySelector('[data-oninput="salesSearch"]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="recSearch"]')){ ui.recSearch = t.value; render(); const el=document.querySelector('[data-oninput="recSearch"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-recipe-batch-yield]')){
    // Réagit à chaque frappe (pas seulement en quittant le champ) pour que l'effet soit
    // immédiatement visible — re-render() recrée l'input, donc on lui redonne le focus ET
    // le curseur en fin de valeur (sinon Chrome le replace en début et "12" tapé au clavier
    // devient "21" une fois le 2e chiffre inséré avant le 1er).
    const rid = t.dataset.recipeBatchYield;
    const r = state.recipes.find(x=>x.id===rid);
    if(r){
      const raw = t.value;
      const v = parseNum(raw);
      r.batch_yield = (raw===''||isNaN(v)||v<=0) ? null : v;
      scheduleSave(); render();
      const el = document.querySelector(`[data-recipe-batch-yield="${rid}"]`);
      if(el){
        el.focus();
        try{
          const len = el.value.length;
          el.type = 'text';
          el.setSelectionRange(len, len);
          el.type = 'number';
        }catch(e){}
      }
    }
    return;
  }
});
document.addEventListener('change', function(e){
  const t = e.target;
  if(t.id==='recipe-photo-input'){
    const file = t.files && t.files[0];
    if(!file || !ui.photoTarget) return;
    const r = state.recipes.find(x=>x.id===ui.photoTarget);
    if(!r) return;
    setSaveIndicator('pending','Traitement de la photo…');
    compressImage(file, 1000, 0.72).then(dataUrl=>{
      r.photo = dataUrl;
      ui.photoTarget = null;
      scheduleSave(); render();
    }).catch(err=>{
      alert(err.message || 'Impossible de lire cette image.');
      setSaveIndicator('saved','À jour');
    });
    return;
  }
  if(t.id==='import-file-input'){ if(t.files && t.files[0]) importBackup(t.files[0]); return; }
  if(t.matches('[data-onchange="lossInv"]')){ ui.lossInv = t.value; render(); return; }
  if(t.matches('[data-onchange="catFilter"]')){ ui.catFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="fournisseurFilter"]')){ ui.fournisseurFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="familyFilter"]')){ ui.familyFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="productSort"]')){ ui.productSort = t.value; render(); return; }
  if(t.matches('[data-onchange="marginSort"]')){ ui.marginSort = t.value; render(); return; }
  if(t.matches('[data-onchange="recipeFilter"]')){ ui.recipeFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="recipe-status"]')){
    const r = state.recipes.find(x=>x.id===t.dataset.rid);
    if(r){
      const newStatus = t.value;
      if(recipeStatus(r)!==newStatus){
        r.status = newStatus;
        r.active = newStatus!=='archived'; // champ historique conservé pour compatibilité
        state.recipe_status_log = state.recipe_status_log || [];
        state.recipe_status_log.push({ id: uid('log'), recipe_id: r.id, status: newStatus, date: todayISO() });
        scheduleSave();
      }
      render();
    }
    return;
  }
  if(t.matches('[data-onchange="historyFilter"]')){ ui.historyFilter = t.value; render(); return; }
  if(t.matches('[data-reception-unit]')){
    const pid = t.dataset.receptionUnit;
    const p = productById(pid);
    const e = recEntry(pid);
    e.qtyUnit = t.value;
    if(e.qtyRaw>0) e.qty = round3(e.qtyRaw * qtyFactor(p, e.qtyUnit));
    render();   // la ligne d'équivalence apparaît/disparaît : rendu complet assumé
    return;
  }
  if(t.matches('[data-reception-qty]') || t.matches('[data-reception-price]')){
    const isQty = !!t.dataset.receptionQty;
    const pid = isQty ? t.dataset.receptionQty : t.dataset.receptionPrice;
    const p = productById(pid);
    const v = parseNum(t.value);
    const e = recEntry(pid);
    if(isQty){
      if(isNaN(v) || v<=0){ delete e.qty; delete e.qtyRaw; }
      else {
        if(!e.qtyUnit) e.qtyUnit = qtyUnitOptions(p)[0].v;
        e.qtyRaw = v;
        e.qty = round3(v * qtyFactor(p, e.qtyUnit));
      }
    } else {
      if(isNaN(v) || v<=0) delete e.price; else e.price = v;
    }
    if(!recIsFilled(e)) delete ui.recDraft[pid];
    refreshReception(t);
    return;
  }
  if(t.matches('[data-sales-qty]')){
    const rid = t.dataset.salesQty;
    const v = Math.round(parseNum(t.value));
    ui.salesDraft = ui.salesDraft || {};
    if(isNaN(v) || v<=0) delete ui.salesDraft[rid]; else ui.salesDraft[rid] = v;
    // Le détail « ce qui va sortir » change de lignes : ici un rendu complet est
    // justifié, on ne peut pas patcher un tableau dont la composition varie.
    render();
    const back = document.querySelector(`[data-sales-qty="${rid}"]`);
    if(back){ back.focus(); back.setSelectionRange(back.value.length, back.value.length); }
    return;
  }
  if(t.matches('[data-onchange="salesDate"]')){ ui.salesDate = t.value; return; }
  if(t.matches('[data-onchange="salesCat"]')){ ui.salesCat = t.value; render(); return; }
  if(t.matches('[data-onchange="recDate"]')){ ui.recDate = t.value; return; }
  if(t.matches('[data-onchange="recCat"]')){ ui.recCat = t.value; render(); return; }
  if(t.matches('[data-onchange="recSupplier"]')){ ui.recSupplier = t.value; render(); return; }
  if(t.matches('[data-onchange="invGroupBy"]')){ ui.invGroupBy = t.value; render(); return; }
  if(t.matches('[data-onchange="stockCatFilter"]')){ ui.stockCatFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="stockFamilyFilter"]')){ ui.stockFamilyFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="stockZoneFilter"]')){ ui.stockZoneFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="stockSort"]')){ ui.stockSort = t.value; render(); return; }
  if(t.matches('[data-inventory-count]')){
    const [invId, idx] = t.dataset.inventoryCount.split(':');
    const inv = (state.inventories||[]).find(x=>x.id===invId);
    if(!inv) return;
    const c = inv.counts[parseInt(idx,10)];
    const v = parseNum(t.value);
    c.counted_qty = isNaN(v)?null:v;
    scheduleSave();
    refreshInventoryRow(t, inv, c);
    return;
  }
  if(t.matches('[data-category-field]')){
    const c = categories()[parseInt(t.dataset.idx,10)];
    if(!c) return;
    const f = t.dataset.categoryField;
    if(f==='has_catalogue') c.has_catalogue = t.checked;
    else {
      const v = (t.value||'').trim();
      if(f==='label' && !v){ render(); return; }   // un nom vide rendrait la catégorie invisible
      c[f] = v;
    }
    scheduleSave(); render();
    return;
  }
  if(t.matches('[data-setting]')){
    const key = t.dataset.setting;
    let val = (t.type==='checkbox') ? t.checked : t.value;
    if(key==='establishment_name') val = String(val||'').trim() || 'Mon établissement';
    if(key==='margin_alert_pct') val = parseNum(val);
    if(key==='tva_rate_default') val = parseNum(val);
    state.settings[key] = val;
    scheduleSave(); render(); return;
  }
  if(t.matches('[data-catalog-price]')){
    const [rid, idx] = t.dataset.catalogPrice.split(':');
    const r = state.recipes.find(x=>x.id===rid);
    const ing = r.ingredients[parseInt(idx,10)];
    if(ing.product_id){
      const p = productById(ing.product_id);
      const newPrice = parseNum(t.value);
      if(!isNaN(newPrice)){
        let s = primarySupplier(p);
        if(!s){
          s = { id: uid('s'), name:'Fournisseur principal', history:[] };
          p.suppliers = p.suppliers || [];
          p.suppliers.push(s);
          p.primary_supplier_id = s.id;
        }
        s.history.push({date: todayISO(), price:newPrice, note:'Modifié depuis la carte '+r.name});
        scheduleSave(); render();
      }
    }
    return;
  }
  if(t.matches('[data-catalog-pv]')){
    const [rid, idx] = t.dataset.catalogPv.split(':');
    const r = state.recipes.find(x=>x.id===rid);
    const ing = r.ingredients[parseInt(idx,10)];
    const v = parseNum(t.value);
    ing.line_pv_ttc = isNaN(v)?null:v;
    scheduleSave(); render();
    return;
  }
  if(t.matches('[data-catalog-hh-pv]')){
    const [rid, idx] = t.dataset.catalogHhPv.split(':');
    const r = state.recipes.find(x=>x.id===rid);
    const ing = r.ingredients[parseInt(idx,10)];
    const v = parseNum(t.value);
    ing.line_happy_hour_pv_ttc = isNaN(v)?null:v;
    scheduleSave(); render();
    return;
  }
});

document.addEventListener('submit', function(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const fd = new FormData(form);

  if(kind==='add-supplier-price'){
    const p = productById(form.dataset.id);
    const s = p.suppliers.find(x=>x.id===form.dataset.sid);
    s.history.push({ date: fd.get('date')||todayISO(), price: parseNum(fd.get('price')), note: fd.get('note')||'' });
    s.history.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-supplier'){
    const p = productById(form.dataset.id);
    const s = { id: uid('s'), name: (fd.get('name')||'').trim() || 'Fournisseur', history: [
      { date: fd.get('date')||todayISO(), price: parseNum(fd.get('price')), note: fd.get('note')||'' }
    ] };
    p.suppliers = p.suppliers || [];
    p.suppliers.push(s);
    if(!p.primary_supplier_id) p.primary_supplier_id = s.id;
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='rename-supplier'){
    const p = productById(form.dataset.id);
    const s = p.suppliers.find(x=>x.id===form.dataset.sid);
    s.name = (fd.get('name')||'').trim() || s.name;
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-product'){
    const id = uid('p');
    const sid = uid('s');
    const fournisseur = (fd.get('fournisseur')||'').trim() || 'Fournisseur principal';
    const conv = readProductConversionFields(fd);
    const newProduct = { id, name: fd.get('name'), unit_label: fd.get('unit_label')||'', category: fd.get('category')||firstCategoryId(),
      suppliers: [{ id: sid, name: fournisseur, history:[{date:todayISO(), price: parseNum(fd.get('price')), note:'Création manuelle'}] }],
      primary_supplier_id: sid,
      family: conv.family, storage_zone: conv.storage_zone, base_unit: conv.base_unit, purchase_size: conv.purchase_size, unit_needs_review: conv.unit_needs_review,
      stock_qty: 0, stock_unit: conv.base_unit ? baseUnitLabel(conv.base_unit) : (fd.get('unit_label')||'unité'), stock_low_threshold: null, stock_movements: [] };
    state.products.push(newProduct);
    const invId = form.dataset.invContext;
    if(invId){
      const inv = (state.inventories||[]).find(x=>x.id===invId);
      if(inv && inv.status==='in_progress') inv.counts.push({ product_id:id, theoretical_qty:0, counted_qty:null });
      ui.invSearch = '';
    }
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='edit-product-meta'){

    p.base_unit = conv.base_unit; p.purchase_size = conv.purchase_size; p.unit_needs_review = conv.unit_needs_review;
    if(conv.base_unit) p.stock_unit = baseUnitLabel(conv.base_unit);
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-recipe'){
    const cat = form.dataset.cat;
    const id = uid('r');
    const hhp = fd.get('happy_hour_price');
    const by = fd.get('batch_yield');
    state.recipes.push({ id, name: fd.get('name'), category: cat, type:'recette', date_iso: todayISO(),
      ingredients: [], pv_ttc: parseNum(fd.get('pv_ttc'))||0, tva_rate: parseNum(fd.get('tva_rate')),
      happy_hour_price: (hhp===''||hhp===null)?null:parseNum(hhp),
      batch_yield: (by===''||by==null)?null:parseNum(by),
      instructions: fd.get('instructions')||'', notes:'', allergens:[], needs_review:false });
    closeOverlay(); scheduleSave(); setView('recipe-detail', id);
  }
  else if(kind==='edit-recipe-meta'){
    const r = state.recipes.find(x=>x.id===form.dataset.id);
    const hhp = fd.get('happy_hour_price');
    // Le nombre de bouteilles/portions (batch_yield) n'est plus dans ce formulaire : il se
    // règle désormais via le champ inline sur la fiche elle-même (data-recipe-batch-yield),
    // pour ne pas l'écraser à chaque enregistrement d'un autre champ.
    r.name = fd.get('name'); r.pv_ttc = parseNum(fd.get('pv_ttc'))||0; r.tva_rate = parseNum(fd.get('tva_rate'));
    r.happy_hour_price = (hhp===''||hhp===null)?null:parseNum(hhp);
    r.instructions = fd.get('instructions')||''; r.notes = fd.get('notes')||'';
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='add-ingredient'){
    const r = state.recipes.find(x=>x.id===form.dataset.rid);
    let pid = fd.get('product_id') || null;
    const newName = (fd.get('new_name')||'').trim();
    let priceBase = null;
    if(!pid && newName){
      pid = uid('p');
      const sid = uid('s');
      const pr = parseNum(fd.get('pr'))||0;
      const fournisseur = (fd.get('fournisseur')||'').trim() || 'Fournisseur principal';
      state.products.push({ id:pid, name:newName, unit_label:'', category:r.category,
        suppliers:[{ id: sid, name: fournisseur, history:[{date:todayISO(), price: pr, note:'Créé depuis la fiche '+r.name}] }],
        primary_supplier_id: sid,
        stock_qty: 0, stock_unit: 'unité', stock_low_threshold: null, stock_movements: [] });
      priceBase = pr;
    } else if(pid){
      priceBase = currentPrice(productById(pid));
    }
    const prod = pid? productById(pid): null;
    r.ingredients.push({
      product_id: pid, display_name: prod? prod.name : newName || 'Ingrédient',
      qty: fd.get('qty')||'', unit:'', pr_base: parseNum(fd.get('pr'))||0,
      price_base: priceBase, weight_coeff: parseNum(fd.get('weight_coeff'))||1.1,
      line_pv_ttc:null, line_pv_ht:null,
    });
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='stock-movement'){
    const p = productById(form.dataset.id);
    const type = fd.get('type');
    let qty = parseNum(fd.get('qty'))||0;
    if(type==='perte'||type==='casse') qty = -Math.abs(qty);
    else if(type==='reception') qty = Math.abs(qty);
    addStockMovement(p, type, qty, fd.get('note')||'', fd.get('date')||todayISO());
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='stock-settings'){
    const p = productById(form.dataset.id);
    const newQty = parseNum(fd.get('stock_qty'));
    const oldQty = p.stock_qty||0;
    p.stock_unit = fd.get('stock_unit')||p.unit_label||'unité';
    const thr = fd.get('stock_low_threshold');
    p.stock_low_threshold = (thr===''||thr===null) ? null : parseNum(thr);
    if(!isNaN(newQty) && Math.abs(newQty-oldQty)>1e-9){
      addStockMovement(p, 'ajustement', round3(newQty-oldQty), fd.get('note')||'Réglage manuel du stock', todayISO());
    }
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-inventory'){
    const cat = fd.get('category');
    const zone = fd.get('zone') || 'all';
    const id = uid('inv');
    // Pré-remplissage : la fiche contient d'emblée tous les produits concernés, avec le
    // stock théorique figé au moment de la création. Les lignes laissées vides sont
    // ignorées à la validation, donc lister large ne fausse rien.
    const counts = fd.get('start_mode')==='empty' ? [] :
      productsForInventory(cat, zone).map(p=>({ product_id:p.id, theoretical_qty: p.stock_qty||0, counted_qty:null }));
    state.inventories = state.inventories || [];
    state.inventories.push({
      id, date: fd.get('date')||todayISO(), category: cat, zone, status:'in_progress',
      created_at: todayISO(), validated_at: null,
      counts
    });
    ui.invSearch = '';
    closeOverlay(); scheduleSave(); setView('inventory-detail', id);
  }
  else if(kind==='edit-ingredient'){
    const r = state.recipes.find(x=>x.id===form.dataset.rid);
    const idx = parseInt(form.dataset.idx,10);
    const ing = r.ingredients[idx];
    ing.display_name = fd.get('display_name');
    ing.qty = fd.get('qty')||'';
    ing.pr_base = parseNum(fd.get('pr_base'))||0;
    ing.weight_coeff = parseNum(fd.get('weight_coeff'))||1;
    if(ing.product_id){ ing.price_base = currentPrice(productById(ing.product_id)); }
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='review-yield'){
    const r = state.recipes.find(x=>x.id===form.dataset.id);
    const n = parseNum(fd.get('yield'));
    if(r && n>0){
      r.batch_yield = n;
      r.is_batch_recipe = true;
      // Les anciens facteurs de correction deviendraient un double comptage.
      r.batch_correction_pr = null; r.batch_correction_prp = null;
      scheduleSave();
    }
    render();
  }
  else if(kind==='review-format'){
    const p = productById(form.dataset.id);
    const size = parseNum(fd.get('size'));
    const unit = fd.get('unit');
    if(p && size>0 && unit){
      p.base_unit = unit;
      p.purchase_size = size;
      p.unit_needs_review = false;
      p.format_confirmed = true;
      p.stock_unit = baseUnitLabel(unit);
      scheduleSave();
    }
    render();
  }
  else if(kind==='add-category'){
    const label = (fd.get('label')||'').trim();
    if(label){
      // L'identifiant est dérivé du nom mais ne changera jamais : c'est lui que
      // portent les produits et les fiches. Renommer la catégorie reste sans risque.
      const base = label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'categorie';
      let id = base, n = 2;
      while(categories().some(c=>c.id===id)) id = base + '-' + (n++);
      state.settings.categories.push({id, label, ico:'▤', recipes_label:'Fiches '+label.toLowerCase(), has_catalogue:false, catalogue_label:''});
      scheduleSave();
    }
    render();
  }
  else if(kind==='add-storage-zone'){
    const name = (fd.get('zone')||'').trim();
    if(name){
      state.settings.storage_zones = state.settings.storage_zones || [];
      if(!state.settings.storage_zones.some(z=>z.toLowerCase()===name.toLowerCase())){
        state.settings.storage_zones.push(name);
        scheduleSave();
      }
      render();
    }
  }
});

document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeOverlay(); closeMobileNav(); } });

// Bouton Précédent/Suivant du navigateur, ou adresse tapée à la main.
window.addEventListener('hashchange', function(){
  if(suppressHashChange){ suppressHashChange = false; return; }
  const target = hashToView();
  if(!target) return;
  if(target.view!=='inventory-detail') ui.invSearch = '';
  ui.view = target.view; ui.id = target.id;
  closeOverlay(); closeMobileNav();
  render();
});

/* ================= Boot ================= */
function boot(){
  const loaded = loadInitialState();
  state = loaded || clone(SEED);
  let needsSave = !loaded;
  if(loaded && (!state.meta || state.meta.seed_version !== SEED.meta.seed_version)){
    mergeSeedUpdate();
    needsSave = true;
  }
  migrateState();
  if(needsSave) scheduleSave();
  const start = hashToView();
  if(start){ ui.view = start.view; ui.id = start.id; }
  render();
  if(needsOnboarding()) showOnboarding(0);
}
boot();

})();
</script>
