<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>RestoStock — Hors ligne</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============ Tokens ============ */
:root{
  --paper:#EEF0EC;
  --surface:#FFFFFF;
  --surface-2:#E3E6DF;
  --border:#D5D9CF;
  --ink:#1B1E1B;
  --ink-muted:#666F63;
  --ink-faint:#9AA294;
  --accent:#45607D;
  --accent-strong:#324B64;
  --accent-wash:#DCE4EA;
  --good:#2F8F5B;
  --good-wash:#DFF0E6;
  --warning:#B4791C;
  --warning-wash:#F5E7D0;
  --critical:#BF4430;
  --critical-wash:#F6DEDA;
  --shadow: 0 1px 2px rgba(20,24,18,.06), 0 6px 20px -8px rgba(20,24,18,.18);
  --radius: 10px;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1A1D1A;
    --surface:#222621;
    --surface-2:#2B302A;
    --border:#3A4038;
    --ink:#EDEFEA;
    --ink-muted:#A4AC9D;
    --ink-faint:#6E7669;
    --accent:#7FA0C2;
    --accent-strong:#9FBBD8;
    --accent-wash:#2A3B4A;
    --good:#5FC98B;
    --good-wash:#20362A;
    --warning:#E0A94A;
    --warning-wash:#3C2F19;
    --critical:#E6786A;
    --critical-wash:#3D2320;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#1A1D1A;
  --surface:#222621;
  --surface-2:#2B302A;
  --border:#3A4038;
  --ink:#EDEFEA;
  --ink-muted:#A4AC9D;
  --ink-faint:#6E7669;
  --accent:#7FA0C2;
  --accent-strong:#9FBBD8;
  --accent-wash:#2A3B4A;
  --good:#5FC98B;
  --good-wash:#20362A;
  --warning:#E0A94A;
  --warning-wash:#3C2F19;
  --critical:#E6786A;
  --critical-wash:#3D2320;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15.5px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--accent-wash); }
a{color:var(--accent-strong);}
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
.num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; }
::-webkit-scrollbar{ height:10px; width:10px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }

/* ============ Shell ============ */
#shell{ display:flex; min-height:100vh; }
.sidebar{
  width:230px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  padding:20px 14px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh;
  overflow-y:auto;
}
.brand{ display:flex; flex-direction:column; gap:3px; padding:2px 8px 16px; border-bottom:1px solid var(--border); }
.brand .mark{ font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-.01em; font-variation-settings:'opsz' 120; }
.brand .sub{ font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.08em; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); margin:18px 8px 6px; font-weight:600; }
.nav-group-label:first-child{ margin-top:0; }
.nav button{
  all:unset; display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:9px;
  color:var(--ink-muted); font-size:14px; font-weight:500; cursor:pointer; min-height:22px;
  position:relative; transition:background .1s, color .1s;
}
.nav button:hover{ background:var(--surface-2); color:var(--ink); }
/* L'écran courant est marqué par un trait vertical : sur une liste de quinze
   entrées, un simple fond coloré se repère mal du coin de l'œil. */
.nav button.active{ background:var(--accent-wash); color:var(--accent-strong); font-weight:600; }
.nav button.active::before{
  content:''; position:absolute; left:-14px; top:6px; bottom:6px; width:3px;
  border-radius:0 3px 3px 0; background:var(--accent);
}
.nav button .ico{ width:18px; display:grid; place-items:center; opacity:.9; flex:none; }
/* Le repli « Plus… ». Volontairement plus discret que les entrées réelles : il
   ouvre une réserve, il n'est pas lui-même une destination. */
.nav-more{ margin-top:18px; color:var(--ink-faint) !important; font-size:13.5px !important; }
.nav-more .ico{ transition:transform .15s; }
.nav-more.open .ico{ transform:rotate(180deg); }
.nav-more .count{ margin-left:auto; font-family:var(--font-mono); font-size:11.5px; color:var(--warning); }
.nav-more-items{ display:flex; flex-direction:column; gap:2px; }
.nav-more-items[hidden]{ display:none; }
.ic{ display:block; }
/* Une icône posée dans une phrase doit suivre la ligne, pas flotter. */
.ic-inline{ vertical-align:-3px; margin-right:6px; opacity:.75; }
.sidebar-foot{ margin-top:auto; padding:10px 8px; font-size:11.5px; color:var(--ink-faint); border-top:1px solid var(--border); padding-top:12px; }
#save-indicator{ display:flex; align-items:center; gap:6px; }
#save-indicator .dot{ width:6px;height:6px;border-radius:50%; background:var(--ink-faint); }
#save-indicator.state-saved .dot{ background:var(--good); }
#save-indicator.state-pending .dot{ background:var(--warning); }
#save-indicator.state-error .dot, #save-indicator.state-readonly .dot{ background:var(--critical); }

.main{ flex:1; min-width:0; }
.topbar{
  position:sticky; top:0; z-index:5; background:var(--paper); border-bottom:1px solid var(--border);
  padding:16px 28px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.topbar h1{ font-size:22px; }
.topbar .desc{ color:var(--ink-muted); font-size:13px; margin-top:2px; }
/* Sur un écran d'ordinateur, le plafond de 1180 px coupait les deux tableaux
   les plus larges — Produits & prix (1220 px) et Stock & commandes (1278 px) —
   pendant qu'il restait 270 px inutilisés à droite. Ce plafond est là pour que
   les phrases ne s'étirent pas sur toute la largeur, pas pour contraindre les
   tableaux : on relève la colonne, et on borne le seul élément qui en souffre,
   le texte suivi posé directement dans la page. */
.content{ padding:22px 28px 60px; max-width:1400px; }
.content > .hint{ max-width:78ch; }

/* ============ Bits ============ */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
/* Les chiffres clés ne sont plus des boîtes posées côte à côte mais un bandeau
   réglé par des filets — comme la tête d'un document, pas comme un tableau de
   bord d'application. Empiler des cartes identiques est ce qui fait qu'une
   interface finit par ressembler à toutes les autres. */
.kpi-row{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:0;
  margin:0 0 30px; border-top:1px solid var(--border); border-bottom:1px solid var(--border);
}
.kpi{ background:none; border:none; box-shadow:none; border-radius:0; padding:18px 24px 18px 0; }
.kpi + .kpi{ border-left:1px solid var(--border); padding-left:24px; }
.kpi.clickable{ transition:background .12s; }
.kpi.clickable:hover{ background:var(--surface); box-shadow:none; border-color:var(--border); }
.kpi .label{ font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); }
/* Fraunces a une taille optique variable : un grand corps demande des fûts plus
   fins et des contrastes plus marqués qu'un petit. On le lui dit. */
.kpi .value{
  font-family:var(--font-display); font-size:32px; margin-top:6px; line-height:1.05;
  font-variation-settings:'opsz' 96; font-variant-numeric:tabular-nums lining-nums;
}
.kpi .value.small{ font-size:19px; }
.kpi .note{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }

.section{ margin-bottom:30px; }
.section-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  margin-bottom:14px; padding-bottom:9px; border-bottom:1px solid var(--border); flex-wrap:wrap;
}
.section-head h2{ font-size:17px; }
.section-head .hint{ font-size:12.5px; color:var(--ink-muted); }

.toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.search{ position:relative; flex:1; min-width:180px; max-width:320px; }
.search input{ width:100%; padding:11px 12px 11px 34px; font-size:15.5px; min-height:44px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--ink); }
.search::before{ content:"⌕"; position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
select.pill, .toolbar select{ padding:10px 12px; min-height:42px; font-size:14.5px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--ink); }
/* Cibles tactiles : l'appli est utilisée sur tablette, debout, souvent avec les
   mains grasses ou mouillées. 40 px de haut est le minimum confortable au doigt ;
   en dessous, on rate le bouton et on clique sur la ligne d'à côté. */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--border); background:var(--surface); padding:10px 16px; min-height:42px; border-radius:9px; font-weight:500; font-size:14.5px; white-space:nowrap; }
.btn:hover{ background:var(--surface-2); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ background:var(--accent-strong); }
.btn-ghost{ border-color:transparent; background:transparent; }
.btn-ghost:hover{ background:var(--surface-2); }
.btn-danger{ color:var(--critical); }
.btn-sm{ padding:7px 12px; min-height:36px; font-size:13.5px; border-radius:8px; }
.spacer{ flex:1; }

.tablewrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); }
table{ width:100%; border-collapse:collapse; font-size:14.5px; }
th{ text-align:left; padding:11px 14px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; position:sticky; top:0; }
th.sortable{ cursor:pointer; user-select:none; }
th.sortable:hover{ color:var(--ink); }
td{ padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
tr:last-child td{ border-bottom:none; }
tbody tr{ transition:background .1s; }
tbody tr.clickable{ cursor:pointer; }
tbody tr.clickable:hover{ background:var(--surface-2); }
/* Dans un tableau, une colonne entière de liens soulignés se lit mal. Le nom
   reste cliquable, mais il se comporte comme du texte jusqu'au survol. */
td a{ color:inherit; text-decoration:none; border-bottom:1px solid transparent; }
td a:hover{ color:var(--accent-strong); border-bottom-color:var(--accent); }
/* Un montant coupé en deux lignes (« 0,06 » puis « € ») donne l'impression d'une
   appli cassée et empêche de balayer une colonne du regard. */
td.num, th.num{ text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }

.pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; }
.pill-good{ background:var(--good-wash); color:var(--good); }
.pill-warning{ background:var(--warning-wash); color:var(--warning); }
.pill-critical{ background:var(--critical-wash); color:var(--critical); }
.pill-neutral{ background:var(--surface-2); color:var(--ink-muted); }
.trend{ font-family:var(--font-mono); font-size:12px; font-weight:600; }
.trend.up{ color:var(--critical); }
.trend.down{ color:var(--good); }
.trend.flat{ color:var(--ink-faint); }

/* Un écran vide est le moment où quelqu'un a le plus besoin d'être guidé :
   c'est qu'il n'a encore rien fait ici. On lui dit quoi faire, pas seulement
   qu'il n'y a rien. */
.empty{ padding:52px 24px; text-align:center; color:var(--ink-muted); }
.empty .big{ font-size:40px; margin-bottom:12px; opacity:.55; }
.empty h3{ font-family:var(--font-display); font-size:20px; color:var(--ink); margin-bottom:6px; }
.empty p{ font-size:14.5px; max-width:420px; margin:0 auto; line-height:1.55; }
.empty .btn{ margin-top:18px; }

/* Drawer / modal */
/* --vvh suit la hauteur RÉELLE visible (visualViewport), pas le viewport de mise en page :
   sur mobile, quand le clavier virtuel s'ouvre pour saisir un champ, la fenêtre visible
   rétrécit sans que « 100vh » ne bouge — sans ça, une modale centrée sur 88vh peut déborder
   sous le clavier et rendre le bouton "Enregistrer" invisible/impossible à atteindre. */
:root{ --vvh: 100vh; }
.overlay{ position:fixed; top:0; left:0; right:0; height:var(--vvh); background:rgba(15,17,14,.4); backdrop-filter:blur(1px); z-index:40; display:flex; justify-content:flex-end; overflow-y:auto; }
.overlay.center{ justify-content:center; align-items:center; align-items:safe center; }
.drawer{ width:min(560px,94vw); background:var(--paper); min-height:100%; overflow-y:auto; box-shadow:-12px 0 30px rgba(0,0,0,.15); animation:slidein .18s ease-out; }
.modal{ width:min(460px,92vw); background:var(--paper); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:calc(var(--vvh) * 0.88); overflow-y:auto; animation:popin .14s ease-out; margin:auto 0; }
@keyframes slidein{ from{ transform:translateX(24px); opacity:0;} to{ transform:none; opacity:1;} }
@keyframes popin{ from{ transform:scale(.97); opacity:0;} to{ transform:none; opacity:1;} }
.drawer-head, .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--paper); z-index:2;}
.drawer-head h3, .modal-head h3{ font-size:18px; }
.drawer-body, .modal-body{ padding:18px 22px 28px; display:flex; flex-direction:column; gap:18px; }
.close-x{ all:unset; cursor:pointer; color:var(--ink-muted); font-size:18px; padding:2px 6px; border-radius:6px; }
.close-x:hover{ background:var(--surface-2); }

.field{ display:flex; flex-direction:column; gap:5px; }
.field label{ font-size:12.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.03em; }
.field input, .field select, .field textarea{ padding:11px 12px; font-size:15.5px; min-height:44px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.field textarea{ resize:vertical; min-height:60px; font-family:var(--font-body); }
.field-row{ display:flex; gap:12px; }
.field-row > .field{ flex:1; }
.hairline{ height:1px; background:var(--border); border:none; margin:2px 0; }

.badge-flag{ display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 7px; border-radius:6px; background:var(--warning-wash); color:var(--warning); font-weight:600; }
.badge-batch{ display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 7px; border-radius:6px; background:var(--accent-wash); color:var(--accent-strong); font-weight:600; }

/* Info tooltips — expliquent le jargon (PA, PR, PRP, food cost...) au survol, au focus
   clavier, ET au tap tactile (tablette en cuisine/bar) via la classe .show. */
.info-tip{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--surface-2); color:var(--ink-muted); font-size:10px; font-weight:700; line-height:1; cursor:help; position:relative; margin-left:4px; vertical-align:middle; flex:none; }
.info-tip:hover, .info-tip:focus, .info-tip.show{ background:var(--accent); color:#fff; outline:none; }
.info-tip .tip-bubble{ display:none; position:absolute; bottom:calc(100% + 7px); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-size:12px; font-weight:400; line-height:1.45; padding:9px 11px; border-radius:8px; width:230px; max-width:60vw; text-align:left; white-space:normal; box-shadow:0 8px 24px rgba(0,0,0,.22); z-index:30; }
.info-tip:hover .tip-bubble, .info-tip:focus .tip-bubble, .info-tip.show .tip-bubble{ display:block; }
.info-tip .tip-bubble::after{ content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--ink); }
th .info-tip{ font-weight:600; }

/* Product detail sparkline */
.spark-wrap{ display:flex; align-items:flex-end; gap:14px; }
.spark-price{ font-family:var(--font-display); font-size:30px; }
.spark-svg{ overflow:visible; }
.hist-table td, .hist-table th{ padding:7px 10px; }

/* Fiche technique */
.fiche{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px 30px; }
.fiche-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:24px;}
/* Photo du dressage : pour un cuisinier, voir l'assiette compte autant que lire
   les quantités. Elle s'affiche à côté du titre, et à l'impression au-dessus. */
/* La photo accompagne la fiche, elle ne la remplace pas : en pleine largeur elle
   repoussait les ingrédients sous la ligne de flottaison, alors que ce sont eux
   qu'on vient lire. Sur écran large elle se range à droite du tableau. */
.fiche-photo{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); display:block; }
.fiche-photo-wrap{ position:relative; margin-bottom:16px; max-width:320px; }
.fiche-photo-actions{ position:absolute; right:8px; bottom:8px; display:flex; gap:6px; }
.photo-drop{ width:100%; aspect-ratio:4/3; border:2px dashed var(--border); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding:12px; color:var(--ink-faint); cursor:pointer; background:var(--surface-2); }
.photo-drop:hover{ border-color:var(--accent); color:var(--accent); }
.photo-drop .ico{ font-size:26px; }
.fiche-top h2{ font-size:26px; font-variation-settings:'opsz' 96; letter-spacing:-.012em; }
.fiche-top .meta{ font-size:12px; color:var(--ink-muted); margin-top:4px; }
.fiche-grid{ display:grid; grid-template-columns:2.2fr 1fr; gap:24px; align-items:start; }
.fiche-metrics{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metric-box{ background:var(--surface-2); border-radius:8px; padding:11px 13px; }
.metric-box .l{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); }
.metric-box .v{ font-family:var(--font-mono); font-size:18px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
/* La chaîne du calcul des pertes, lue de gauche à droite comme une opération
   posée. Les signes + − = sont portés par les intitulés : empilées sur
   téléphone, les étapes restent dans l'ordre et le calcul reste lisible. */
.chain-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.chain-grid .metric-box:last-child{ background:none; border:1px solid var(--border); }
@media (max-width: 880px){ .chain-grid{ grid-template-columns:1fr 1fr; } }
/* Le food cost est le chiffre qui décide de garder ou de changer une recette :
   il mérite d'être lu d'un coup d'œil, et de porter lui-même sa couleur de santé,
   au lieu d'être noyé parmi cinq indicateurs de même poids. */
.metric-hero{ grid-column:1/-1; border-radius:10px; padding:16px 18px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.metric-hero .l{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; opacity:.85; }
.metric-hero .v{ font-family:var(--font-display); font-size:38px; line-height:1; font-weight:600; font-variation-settings:'opsz' 96; font-variant-numeric:tabular-nums lining-nums; }
.metric-hero .s{ font-size:13.5px; opacity:.85; }
.hero-good{ background:var(--good-wash); color:var(--good); }
.hero-warning{ background:var(--warning-wash); color:var(--warning); }
.hero-critical{ background:var(--critical-wash); color:var(--critical); }
.hero-neutral{ background:var(--surface-2); color:var(--ink-muted); }
.allerg-grid{ display:flex; flex-wrap:wrap; gap:6px; }
.allerg-chip{ font-size:11.5px; padding:4px 8px; border-radius:7px; border:1px solid var(--border); color:var(--ink-muted); cursor:pointer; user-select:none; }
.allerg-chip.on{ background:var(--warning-wash); color:var(--warning); border-color:transparent; font-weight:600; }
.instructions{ font-size:13px; color:var(--ink-muted); font-style:italic; margin-bottom:14px; white-space:pre-wrap; }
.notes-box{ font-size:12.5px; color:var(--ink-muted); background:var(--surface-2); border-radius:8px; padding:10px 12px; white-space:pre-wrap; }

.menu-toggle{ display:none; }
.sidebar-backdrop{ display:none; }
@media (max-width: 880px){
  input, select, textarea{ font-size:16px !important; }
  .btn{ min-height:46px; }
  td{ padding:14px 12px; }
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; width:250px; z-index:60;
    transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow);
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar-backdrop{ position:fixed; inset:0; background:rgba(10,12,9,.4); z-index:50; }
  .sidebar-backdrop:not(.show){ display:none; }
  .content{ padding:16px; }
  .fiche-grid{ grid-template-columns:1fr; }
  .menu-toggle{
    all:unset; display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border:1px solid var(--border); border-radius:8px;
    background:var(--surface); font-size:18px; cursor:pointer; flex:none;
  }
  .topbar{ align-items:center; }
}

/* Impression — une fiche affichée au poste, souvent plastifiée. Elle doit tenir
   sur une page, se lire à un mètre, et ne montrer que ce qui sert en service :
   la photo, les quantités, les allergènes. Les coûts et les marges restent à
   l'écran ; personne n'affiche ses marges au-dessus du piano. */
@media print{
  @page{ margin:12mm; }
  .sidebar, .topbar, .no-print, .sidebar-backdrop, #overlay-root{ display:none !important; }
  body{ background:#fff; color:#000; font-size:12pt; }
  .content{ padding:0; max-width:none; }
  .fiche{ box-shadow:none; border:none; padding:0; }
  .fiche-top{ border-bottom:2px solid #000; }
  .fiche-top h2{ font-size:24pt; }
  .fiche-grid{ grid-template-columns:1fr; gap:14px; }
  .fiche-photo-wrap{ float:right; width:46mm; margin:0 0 8px 10px; }
  .fiche-photo{ aspect-ratio:4/3; }
  .tablewrap{ border:none; box-shadow:none; overflow:visible; }
  table{ font-size:11pt; }
  th{ background:#eee !important; color:#000; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  td, th{ padding:5pt 6pt; border-bottom:1px solid #bbb; }
  /* Les colonnes d'argent et le bandeau de marge ne partent pas en cuisine. */
  .fiche-metrics, .metric-hero, .metric-box, .spark-wrap, .hist-table{ display:none !important; }
  th:nth-child(3), th:nth-child(4), td:nth-child(3), td:nth-child(4){ display:none; }
  tfoot{ display:none; }
  /* Deux colonnes seulement une fois les coûts retirés : on évite le grand vide
     entre l'ingrédient et sa quantité. */
  th:first-child, td:first-child{ width:auto; }
  th:nth-child(2), td:nth-child(2){ width:32mm; }
  .allerg-chip{ border:1px solid #000; color:#000; }
  .allerg-chip:not(.on){ display:none; }
  .instructions{ font-style:normal; color:#000; font-size:11pt; }
  .notes-box{ background:none; border:1px solid #bbb; color:#000; }
  .print-page{ page-break-after:always; }
  .print-page:last-child{ page-break-after:auto; }
  .fiche, tr, .allerg-grid{ break-inside:avoid; }
}

/* ---- Lecture d'un nombre saisi à la main ----
   Sur un clavier français on tape « 1,5 ». Un <input type="text" inputmode="decimal"> considère
   alors la valeur comme invalide et renvoie une chaîne VIDE, sans message :
   la quantité est perdue en silence et personne ne s'en aperçoit. On saisit donc
   en texte, et on interprète nous-mêmes la virgule, les espaces et l'espace
   insécable des séparateurs de milliers. */
function parseNum(v){
  if(v===null || v===undefined) return NaN;
  const s = String(v).trim().replace(/[\s\u00a0\u202f]/g,'').replace(',', '.');
  if(s==='') return NaN;
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
/* Une photo de téléphone pèse 3 à 5 Mo. Stockée telle quelle dans 86 fiches,
   elle saturerait le stockage du navigateur et alourdirait chaque sauvegarde.
   On la redimensionne donc à 1000 px et on la ré-encode en JPEG avant de la
   garder : on passe de plusieurs mégaoctets à quelques dizaines de kilooctets,
   sans différence visible à l'écran ni à l'impression. */
const PHOTO_MAX_BYTES = 130 * 1024;   // ~11 Mo pour 86 fiches : tient dans le navigateur
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Lecture du fichier impossible'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ce fichier n’est pas une image lisible'));
      img.onload = () => {
        const render = (side, q) => {
          const scale = Math.min(1, side / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);   // fond blanc pour les PNG transparents
          ctx.drawImage(img, 0, 0, w, h);
          return canvas.toDataURL('image/jpeg', q);
        };
        // La qualité seule ne suffit pas : une photo très détaillée reste lourde.
        // On abaisse d'abord la qualité, puis la taille, jusqu'à passer sous le
        // plafond — sinon 86 fiches saturent le stockage du navigateur et c'est
        // TOUTE la sauvegarde qui échoue, pas seulement la photo.
        let out = render(maxSide, quality);
        const steps = [[maxSide,0.6],[maxSide,0.5],[820,0.55],[820,0.45],[640,0.5],[640,0.4],[480,0.4]];
        for(const [side,q] of steps){
          if(out.length * 0.75 <= PHOTO_MAX_BYTES) break;
          out = render(side, q);
        }
        resolve(out);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function median(sortedArr){

/* ---- Unités canoniques (conversion automatique kg/L → g/cl/pièce) ---- */
const BASE_UNIT_LABELS = { g:'g', cl:'cl', unite:'unité' };
function baseUnitLabel(bu){ return BASE_UNIT_LABELS[bu] || bu || ''; }
// Les quantités de stock sont TOUJOURS exprimées en unité de base (cl, g, unité).
// Or `stock_unit` a été rempli à l'import avec le FORMAT D'ACHAT (« 70cl », « litre »),
// ce qui affichait « 508,59 70cl » ou « 100 litre » pour 100 cl. On affiche donc
// l'unité de base dès qu'elle est connue, et on ne retombe sur stock_unit que pour
// les produits dont le format n'a pas encore été normalisé.
function stockUnitLabel(p){
  if(!p) return '';
  return p.base_unit ? baseUnitLabel(p.base_unit) : (p.stock_unit || '');
}
const UNIT_PIECE_WORDS = ['piece','pieces','pces','pce','unite','unites','botte','bottes','oeuf','oeufs','gousses','barquette',
  'boite','boites','sac','sacs','bidon','bidons','tube','tubes','bocal','bocaux','sachet','sachets',
  'bouteille','bouteilles','bt','carton','cartons','colis'];
function parseUnitLabel(label){
  // JS mirror of the Python parse_unit() used at import time — lets a manually
  // created/edited product get an auto-suggested canonical unit from its format text
  // (ex: "70cl" → cl/70, "1kg" → g/1000, "pièce" → unité/1).
  if(!label) return {base_unit:null, purchase_size:null, needs_review:true};
  const txt = String(label).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/,/g,'.');
  const patterns = [
    [/(\d+\.?\d*)\s*kg\b/, q=>['g', q*1000]],
    [/(\d+\.?\d*)\s*gr?\b/, q=>['g', q]],
    [/(\d+\.?\d*)\s*cl\b/, q=>['cl', q]],
    [/(\d+\.?\d*)\s*ml\b/, q=>['cl', q/10]],
    [/(\d+\.?\d*)\s*litres?\b/, q=>['cl', q*100]],
    [/(\d+\.?\d*)\s*\bl\b/, q=>['cl', q*100]],
  ];
  let best=null, bestPos=null;
  patterns.forEach(([re,fn])=>{
    const m = txt.match(re);
    if(m){
      const pos = m.index;
      if(bestPos===null || pos<bestPos){
        const q = parseFloat(m[1]);
        if(q>0){ const r=fn(q); if(r[1]>0){ best=[r[0], Math.round(r[1]*10000)/10000]; bestPos=pos; } }
      }
    }
  });
  if(best) return {base_unit:best[0], purchase_size:best[1], needs_review:false};
  if(UNIT_PIECE_WORDS.some(w=>txt.includes(w))) return {base_unit:'unite', purchase_size:1, needs_review:false};
  if(/\bkg\b/.test(txt) && !/\d/.test(txt)) return {base_unit:'g', purchase_size:1000, needs_review:false};
  if(/\blitres?\b|\bl\b/.test(txt) && !/\d/.test(txt)) return {base_unit:'cl', purchase_size:100, needs_review:false};
  return {base_unit:null, purchase_size:null, needs_review:true};
}
function pricePerBaseUnit(p){
  const cp = currentPrice(p);
  if(cp==null || !p.base_unit || !p.purchase_size) return null;
  return cp / p.purchase_size;
}
function fmtMoneyPrecise(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const d = Math.abs(v) < 0.1 ? 4 : 2;
  return v.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}) + ' €';
}
function fmtPricePerBaseUnit(p){
  const per = pricePerBaseUnit(p);
  if(per==null) return null;
  return `${fmtMoneyPrecise(per)} / ${baseUnitLabel(p.base_unit)}`;
}
function purchaseFormatLabel(p){
  if(!p.base_unit || !p.purchase_size) return null;
  return `${fmtNum(p.purchase_size, p.base_unit==='unite'?0:(p.purchase_size%1===0?0:2))} ${baseUnitLabel(p.base_unit)}`;
}

/* ================= Domain calculations ================= */
function productById(id){ return state.products.find(p=>p.id===id) || null; }
function primarySupplier(prod){
  if(!prod || !prod.suppliers || !prod.suppliers.length) return null;
  return prod.suppliers.find(s=>s.id===prod.primary_supplier_id) || prod.suppliers[0];
}
function cheapestSupplier(prod){
  if(!prod || !prod.suppliers || !prod.suppliers.length) return null;
  let best = null, bestPrice = Infinity;
  prod.suppliers.forEach(s=>{
    if(!s.history || !s.history.length) return;
    const p = s.history[s.history.length-1].price;
    if(p!=null && p<bestPrice){ bestPrice = p; best = s; }
  });
  return best;
}
function lastPrice(prod){
  const s = primarySupplier(prod);
  if(!s || !s.history || !s.history.length) return null;
  return s.history[s.history.length-1].price;
}
/* ---- Prix moyen pondéré ----
   Chiffrer une fiche sur le DERNIER prix payé la rend instable : un achat de
   dépannage à prix fort dégrade d'un coup la marge de tous les plats concernés,
   puis elle remonte à la livraison suivante. On calcule donc la moyenne de ce
   qu'on a réellement payé, pondérée par les quantités reçues.

   Uniquement sur les lignes issues d'une réception, celles dont on connaît la
   quantité. L'historique importé des tableurs mélange des conditionnements
   différents — le sel à 5,05 € et à 0,44 € n'est pas une baisse de prix, ce sont
   deux formats — et en faire une moyenne inventerait une précision qu'on n'a pas. */
function weighedEntries(prod){
  const out = [];
  (prod && prod.suppliers || []).forEach(s=>(s.history||[]).forEach(h=>{
    if(h.price!=null && h.qty>0) out.push(h);
  }));
  return out;
}
function averagePrice(prod){
  const e = weighedEntries(prod);
  if(e.length < 2) return null;
  let cost = 0, qty = 0;
  e.forEach(h=>{ cost += h.price * h.qty; qty += h.qty; });
  return qty>0 ? cost/qty : null;
}
function priceBasis(prod){
  const avg = averagePrice(prod);
  if(avg!=null) return {price:avg, kind:'moyen', count:weighedEntries(prod).length};
  const last = lastPrice(prod);
  return {price:last, kind:'dernier', count:last!=null?1:0};
}
// Base de calcul de tous les coûts : la moyenne dès qu'elle est fiable.
function currentPrice(prod){ return priceBasis(prod).price; }
function previousPrice(prod){
  const s = primarySupplier(prod);
  if(!s || !s.history || s.history.length<2) return null;
  return s.history[s.history.length-2].price;
}
function liveIngredientPR(ing){
  if(ing.product_id){
    const prod = productById(ing.product_id);
    const cp = currentPrice(prod);
    if(prod && cp!=null && ing.price_base){
      return ing.pr_base * (cp/ing.price_base);
    }
  }
  return ing.pr_base||0;
}
function liveIngredientPRP(ing){ return liveIngredientPR(ing) * (ing.weight_coeff||1); }

function recipeTVA(recipe){ return (recipe.tva_rate!=null? recipe.tva_rate : state.settings.tva_rate_default); }

/* ---- Batch preparations (one prep yields several bottles/portions) ---- */
// A recipe can now carry an explicit, editable batch_yield (e.g. "this prep makes 4
// bottles"): ingredient costs are entered at full-batch size and simply divided by the
// yield, live and reactive to price changes — no opaque correction factor needed. This
// takes priority over the older batch_correction_pr/prp anchors that were derived at
// import time from the original fiche's own totals (kept as a fallback for recipes
// nobody has set an explicit yield on yet).
function isBatchRecipe(recipe){
  return !!((recipe.batch_yield!=null && recipe.batch_yield>0) || recipe.is_batch_recipe);
}
// Statut de la fiche : à la carte (par défaut), en test (essai en cours, pas encore
// officiellement à la carte), ou hors carte (ancienne recette, plus faite). `active:false`
// (ancien champ, avant l'ajout du statut « en test ») est toujours lu comme hors carte, pour
// ne pas perdre les fiches déjà retirées de la carte avant cette mise à jour.
const RECIPE_STATUS_LABELS = { active:'À la carte', test:'En test', archived:'Hors carte' };
function recipeStatus(recipe){
  if(recipe.status==='test') return 'test';
  if(recipe.status==='archived' || recipe.active===false) return 'archived';
  return 'active';
}
function isRecipeActive(recipe){
  return recipeStatus(recipe)==='active';
}
function recipeTotals(recipe, overridePvTtc){
  let pr=0, prp=0;
  (recipe.ingredients||[]).forEach(ing=>{ pr += liveIngredientPR(ing); prp += liveIngredientPRP(ing); });
  if(recipe.batch_yield!=null && recipe.batch_yield>0){
    pr = pr / recipe.batch_yield;
    prp = prp / recipe.batch_yield;
  } else {
    if(recipe.batch_correction_pr!=null) pr *= recipe.batch_correction_pr;
    if(recipe.batch_correction_prp!=null) prp *= recipe.batch_correction_prp;
  }
  const tva = recipeTVA(recipe);
  const pv_ttc = (overridePvTtc!=null ? overridePvTtc : recipe.pv_ttc) || 0;
  const pv_ht = pv_ttc>0 ? pv_ttc/(1+tva) : 0;
  const marge = pv_ttc>0 ? pv_ht - prp : null;
  const coeff = (pv_ttc>0 && prp>0) ? pv_ht/prp : null;
  const foodPct = pv_ht>0 ? (prp/pv_ht*100) : null;
  return { pr, prp, pv_ht, pv_ttc, marge, coeff, foodPct };
}
function lineTotals(recipe, ing, overridePvTtc){
  const pr = liveIngredientPR(ing);
  const prp = liveIngredientPRP(ing);
  const tva = recipeTVA(recipe);
  const pv_ttc = (overridePvTtc!=null ? overridePvTtc : ing.line_pv_ttc) || 0;
  const pv_ht = pv_ttc>0 ? pv_ttc/(1+tva) : 0;
  const marge = pv_ttc>0 ? pv_ht - prp : null;
  const coeff = (pv_ttc>0 && prp>0) ? pv_ht/prp : null;
  const foodPct = pv_ht>0 ? (prp/pv_ht*100): null;
  return { pr, prp, pv_ht, pv_ttc, marge, coeff, foodPct };
}
/* ---- Happy hour ---- */
function recipeHappyHourTotals(recipe){
  if(recipe.happy_hour_price==null) return null;
  return recipeTotals(recipe, recipe.happy_hour_price);
}
function lineHappyHourTotals(recipe, ing){
  if(ing.line_happy_hour_pv_ttc==null) return null;
  return lineTotals(recipe, ing, ing.line_happy_hour_pv_ttc);
}
function hhSettings(){
  const s = state.settings;
  return { enabled: !!s.happy_hour_enabled, start: s.happy_hour_start||'17:00', end: s.happy_hour_end||'19:00' };
}
function isHappyHourNow(){
  const hh = hhSettings();
  if(!hh.enabled) return false;
  const now = new Date();
  const cur = now.getHours()*60 + now.getMinutes();
  const [sh,sm] = hh.start.split(':').map(Number);
  const [eh,em] = hh.end.split(':').map(Number);
  const start = sh*60+sm, end = eh*60+em;
  if(start===end) return false;
  if(start<end) return cur>=start && cur<end;
  return cur>=start || cur<end; // overnight range (e.g. 22:00-02:00)
}

/* ---- Food cost history (reconstructed from ingredient purchase-price history) ---- */
function priceAsOf(product, date){
  const s = primarySupplier(product);
  if(!s || !s.history || !s.history.length) return null;
  let best = null;
  s.history.forEach(h=>{ const hd = h.date || '0000-00-00'; if(hd<=date) best = h.price; });
  if(best==null) best = s.history[0].price;
  return best;
}
function recipeCostHistory(recipe){
  const dateSet = new Set();
  (recipe.ingredients||[]).forEach(ing=>{
    if(!ing.product_id) return;
    const prod = productById(ing.product_id);
    const s = prod ? primarySupplier(prod) : null;
    if(s) s.history.forEach(h=>{ if(h.date) dateSet.add(h.date); });
  });
  if(!dateSet.size) return [];
  const dates = Array.from(dateSet).sort();
  const tva = recipeTVA(recipe);
  const pv_ht = (recipe.pv_ttc>0) ? recipe.pv_ttc/(1+tva) : 0;
  return dates.map(date=>{
    let prp = 0;
    (recipe.ingredients||[]).forEach(ing=>{
      let pr;
      if(ing.product_id){
        const prod = productById(ing.product_id);
        const price = prod ? priceAsOf(prod, date) : null;
        pr = (price!=null && ing.price_base>0) ? ing.pr_base*(price/ing.price_base) : (ing.pr_base||0);
      } else {
        pr = ing.pr_base||0;
      }
      prp += pr * (ing.weight_coeff||1);
    });
    if(recipe.batch_yield!=null && recipe.batch_yield>0){
      prp = prp / recipe.batch_yield;
    } else if(recipe.batch_correction_prp!=null){
      prp *= recipe.batch_correction_prp;
    }
    const foodPct = pv_ht>0 ? (prp/pv_ht*100) : null;
    return {date, prp, foodPct};
  });
}
function sparklineSVG(values){
  const w=260,h=52,pad=6;
  if(!values.length) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min)||1;
  const stepX = values.length>1 ? (w-2*pad)/(values.length-1) : 0;
  const pts = values.map((v,i)=>{
    const x = pad + i*stepX;
    const y = pad + (h-2*pad) * (1 - (v-min)/range);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const last = pts[pts.length-1].split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--accent-strong)"/>
  </svg>`;
}
function marginStatus(foodPct){

}

function recipesUsingProduct(pid){

/* ---- Stock & inventaire ---- */
const MOVEMENT_TYPES = { reception:'Réception', perte:'Perte', casse:'Casse', ajustement:'Ajustement', inventaire:'Écart inventaire' };
function round3(v){ if(v===null||v===undefined||isNaN(v)) return v; return Math.round(v*1000)/1000; }
function valueForQty(p, qty){
  const cp = currentPrice(p);
  if(cp==null || qty==null) return 0;
  // Le prix est toujours au format d'achat (ex : la bouteille de 70cl) ; quand la
  // quantité est en unité de base (cl/g/pièce), il faut la ramener en équivalent
  // format d'achat avant de multiplier, sinon la valorisation est fausse d'un
  // facteur purchase_size.
  if(p.base_unit && p.purchase_size) return cp * qty / p.purchase_size;
  return cp * qty;
}
/* ---- Prix de référence : ce que l'équipe lit sur le bon de livraison ----
   Les prix sont stockés au format d'achat (la bouteille de 70 cl, le seau de 2,5 kg).
   Mais personne ne raisonne comme ça en réception : on lit « 9,32 € le kilo ». On
   convertit donc dans les deux sens, pour que la saisie reste celle du bon de
   livraison et le stockage celui du reste de l'appli. */
function refUnitOf(p){
  if(p.base_unit==='g')     return {label:'kg',    factor:1000};
  if(p.base_unit==='cl')    return {label:'L',     factor:100};
  if(p.base_unit==='unite') return {label:'unité', factor:1};
  return null;   // format d'achat inconnu : on saisit le prix du colis tel quel
}
function refUnitLabel(p){
  const r = refUnitOf(p);
  return r ? r.label : (p.unit_label || 'colis');
}
function packToRefPrice(p, packPrice){
  if(packPrice==null) return null;
  const r = refUnitOf(p);
  if(!r || !p.purchase_size) return packPrice;
  return packPrice * r.factor / p.purchase_size;
}
function refToPackPrice(p, refPrice){
  if(refPrice==null) return null;
  const r = refUnitOf(p);
  if(!r || !p.purchase_size) return refPrice;
  return refPrice * p.purchase_size / r.factor;
}
function fmtRefPrice(p, packPrice){
  const v = packToRefPrice(p, packPrice);
  if(v==null) return '—';
  return `${fmtMoneyPrecise(v)} / ${refUnitLabel(p)}`;
}
// Le meilleur fournisseur connu, comparé au même prix de référence pour tous.
function bestSupplierFor(p){
  let best = null;
  (p.suppliers||[]).forEach(s=>{
    if(!s.history || !s.history.length) return;
    const packPrice = s.history[s.history.length-1].price;
    if(packPrice==null) return;
    const ref = packToRefPrice(p, packPrice);
    if(ref==null) return;
    if(!best || ref < best.refPrice) best = {supplier:s, refPrice:ref, packPrice, date:s.history[s.history.length-1].date};
  });
  return best;
}
function stockValue(p){ return valueForQty(p, p.stock_qty||0); }
function isLowStock(p){ return p.stock_low_threshold!=null && (p.stock_qty||0) <= p.stock_low_threshold; }
function addStockMovement(p, type, qty, note, date){
  p.stock_movements = p.stock_movements || [];
  p.stock_movements.push({ id:uid('m'), date: date||todayISO(), type, qty: round3(qty), note: note||'' });
  p.stock_qty = round3((p.stock_qty||0) + qty);
}
/* ---- Ce qu'une fiche fait sortir du stock ----
   Les fiches ne stockent pas de quantité chiffrée : « 2cl », « 3 à 4 feuilles ».
   Mais elles stockent le coût de la ligne (pr_base) et le prix du produit au
   moment de l'import (price_base). Comme pr_base = (price_base / format d'achat)
   × quantité, la quantité se retrouve exactement — et elle est cohérente avec le
   coût affiché, ce qu'une relecture du texte ne garantirait pas. */
function ingredientBaseQty(ing){
  const p = ing.product_id ? productById(ing.product_id) : null;
  if(!p || !p.purchase_size || !ing.price_base || ing.pr_base==null) return null;
  const q = ing.pr_base * p.purchase_size / ing.price_base;
  return (isFinite(q) && q>0) ? q : null;
}
// Ce que fait sortir UNE vente de cette fiche, produit par produit.
function recipeConsumption(recipe){
  const out = [];
  (recipe.ingredients||[]).forEach(ing=>{
    const q = ingredientBaseQty(ing);
    if(q==null) return;
    const p = productById(ing.product_id);
    if(!p) return;
    let qty = q;
    // Même arithmétique que pour le coût : une préparation en lot est saisie
    // pour le lot entier, donc une vente n'en sort qu'une fraction.
    if(recipe.batch_yield!=null && recipe.batch_yield>0) qty = qty / recipe.batch_yield;
    else if(recipe.batch_correction_pr!=null) qty = qty * recipe.batch_correction_pr;
    out.push({product:p, qty, name: ing.display_name});
  });
  return out;
}
// Lignes d'une fiche qu'on ne sait pas déduire : signalées, jamais devinées.
function recipeUntrackedLines(recipe){
  return (recipe.ingredients||[]).filter(ing=>ingredientBaseQty(ing)==null).length;
}
function stockKpis(){
  // Valeur ventilée par catégorie définie dans les Réglages, plus une part
  // « partagée » pour les produits utilisés des deux côtés.
  const byCategory = {};
  categories().forEach(c=>{ byCategory[c.id] = 0; });
  let totalVal=0, bothVal=0, lowCount=0;
  state.products.forEach(p=>{
    const v = stockValue(p);
    totalVal += v;
    if(p.category==='both') bothVal += v;
    else if(byCategory[p.category]!==undefined) byCategory[p.category] += v;
    else byCategory[firstCategoryId()] = (byCategory[firstCategoryId()]||0) + v;
    if(isLowStock(p)) lowCount++;
  });
  return {totalVal, byCategory, bothVal, lowCount};
}
/* ================= Catégories de l'établissement =================
   Bar et Cuisine ne sont plus écrits dans le code : ce sont des données que
   l'établissement définit dans les Réglages. C'est ce qui permet à une

// Options d'un menu déroulant de catégorie. `extra` ajoute une entrée en tête

function migrateState(){
  state.settings = state.settings || {};
  if(!state.settings.categories || !state.settings.categories.length){
    state.settings.categories = clone(DEFAULT_CATEGORIES);
  }
  state.settings.categories.forEach(c=>{
    if(!c.recipes_label) c.recipes_label = 'Fiches ' + String(c.label||'').toLowerCase();
    if(c.has_catalogue===undefined) c.has_catalogue = false;
  });
  if(!state.settings.storage_zones || !state.settings.storage_zones.length){
    state.settings.storage_zones = ['Chambre froide 1','Chambre froide 2','Chambre froide 3','Chambre froide 4',
      'Congélateur','Armoire froide','Chariot','Réserve sèche / Épicerie','Cave','Bar - réserve','Bar - comptoir'];
  }
  state.products.forEach(p=>{
    if(p.stock_qty===undefined) p.stock_qty = 0;
    if(!p.stock_unit) p.stock_unit = p.unit_label || 'unité';
    if(p.stock_low_threshold===undefined) p.stock_low_threshold = null;
    if(!p.stock_movements) p.stock_movements = [];
    if(p.family===undefined) p.family = null;
    if(p.storage_zone===undefined) p.storage_zone = null;
    if(p.base_unit===undefined || p.purchase_size===undefined || p.unit_needs_review===undefined){
      const wasPristine = (p.stock_qty||0)===0 && (!p.stock_movements || !p.stock_movements.length);
      const parsed = parseUnitLabel(p.unit_label);
      if(p.base_unit===undefined) p.base_unit = parsed.base_unit;
      if(p.purchase_size===undefined) p.purchase_size = parsed.purchase_size;
      if(p.unit_needs_review===undefined) p.unit_needs_review = parsed.needs_review;
      // La première fois qu'on connaît l'unité canonique d'un produit jamais encore
      // compté, on aligne son unité de stock dessus (g/cl/unité) pour que tous les
      // produits d'un même type se comptent de la même façon — plus de mélange
      // "kg" / "500gr" / "pièce" selon la fiche.
      if(p.base_unit && wasPristine) p.stock_unit = baseUnitLabel(p.base_unit);
    }
    // legacy shape: a single top-level history/price (+ optional fournisseur string) instead of suppliers[]
    if(!p.suppliers){
      const sid = uid('s');
      const name = (p.fournisseur||'').trim() || 'Fournisseur principal';
      p.suppliers = (p.history && p.history.length) ? [{ id: sid, name, history: p.history }] : [];
      p.primary_supplier_id = p.suppliers.length ? sid : null;
      delete p.history;
      delete p.price;
      delete p.fournisseur;
    }
  });
  if(!state.inventories) state.inventories = [];
}
function normKey(name){
  return String(name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
}
// Merges newer seed content (e.g. a later cuisine/feature import) into an already-saved
// state, without touching existing products/recipes (so price history & edits are kept).
// Matching is by normalized name so ids don't need to line up across seed regenerations.
function mergeSeedUpdate(){
  // La version en ligne ne transporte aucune donnée de départ : chaque
  // établissement remplit son espace. Sans ce garde-fou, la fonction planterait
  // le jour où quelqu'un l'appellerait par erreur.
  if(!SEED || !SEED.products) return;
  const idMap = {};
  const existingByKey = {};
  state.products.forEach(p=>{ existingByKey[normKey(p.name)] = p; });
  SEED.products.forEach(sp=>{
    const key = normKey(sp.name);
    const existing = existingByKey[key];
    if(existing){
      idMap[sp.id] = existing.id;
      if(sp.category==='both' && existing.category!=='both') existing.category = 'both';
      // Famille / zone / unité canonique sont des données déduites (pas saisies par
      // l'utilisatrice) : on les complète seulement si absentes, pour ne jamais écraser
      // une correction qu'elle aurait faite depuis dans la fiche produit.
      if((existing.family===undefined || existing.family===null) && sp.family) existing.family = sp.family;
      if((existing.storage_zone===undefined || existing.storage_zone===null) && sp.storage_zone) existing.storage_zone = sp.storage_zone;
      if(existing.base_unit===undefined || existing.base_unit===null){
        const wasPristine = (existing.stock_qty||0)===0 && (!existing.stock_movements || !existing.stock_movements.length);
        if(sp.base_unit!=null){
          existing.base_unit = sp.base_unit;
          existing.purchase_size = sp.purchase_size!=null ? sp.purchase_size : null;
          existing.unit_needs_review = false;
          if(wasPristine) existing.stock_unit = baseUnitLabel(sp.base_unit);
        } else if(existing.unit_needs_review===undefined){
          existing.unit_needs_review = true;
        }
      }
    } else {
      const np = clone(sp);
      np.id = uid('p');
      state.products.push(np);
      idMap[sp.id] = np.id;
      existingByKey[key] = np;
    }
  });
  const existingRecipeByKey = {};
  state.recipes.forEach(r=>{ existingRecipeByKey[r.category+'::'+normKey(r.name)] = r; });
  SEED.recipes.forEach(sr=>{
    const rk = sr.category+'::'+normKey(sr.name);
    const existingRecipe = existingRecipeByKey[rk];
    if(existingRecipe){
      // Recipe already exists (possibly user-edited): don't touch ingredients/pv/notes,
      // but do resync the batch-preparation correction factors — these describe the
      // recipe's own structure (a batch yielding several bottles/portions), not user data,
      // so a corrected/updated seed should always be able to fix a wrong live total.
      existingRecipe.is_batch_recipe = !!sr.is_batch_recipe;
      existingRecipe.batch_correction_pr = sr.batch_correction_pr!=null ? sr.batch_correction_pr : null;
      existingRecipe.batch_correction_prp = sr.batch_correction_prp!=null ? sr.batch_correction_prp : null;
      // Même logique pour le signalement « à vérifier » : décrit un problème détecté dans
      // la fiche importée (pas une saisie de l'utilisatrice), donc une correction du seed
      // doit pouvoir l'activer sur une fiche déjà en local — mais jamais le désactiver
      // silencieusement si elle avait été signalée manuellement entretemps.
      if(sr.needs_review) existingRecipe.needs_review = true;
      return;
    }
    const nr = clone(sr);
    nr.id = uid('r');
    (nr.ingredients||[]).forEach(ing=>{ if(ing.product_id && idMap[ing.product_id]) ing.product_id = idMap[ing.product_id]; });
    state.recipes.push(nr);
    existingRecipeByKey[rk] = nr;
  });
  if(!state.inventories) state.inventories = [];
  // Inventaires historiques fournis avec le seed (ex : import initial du 30/06/2026) :
  // ajoutés une seule fois (par id), jamais réécrits — une session déjà présente,
  // même modifiée par l'utilisatrice depuis, n'est jamais touchée.
  const existingInvIds = new Set(state.inventories.map(i=>i.id));
  (SEED.inventories||[]).forEach(si=>{
    if(existingInvIds.has(si.id)) return;
    const ni = clone(si);
    ni.counts = (ni.counts||[]).map(c=>{ c.product_id = idMap[c.product_id] || c.product_id; return c; })
      .filter(c=> state.products.some(p=>p.id===c.product_id));
    if(ni.counts.length) state.inventories.push(ni);
  });
  state.meta = state.meta || {};
  state.meta.seed_version = SEED.meta.seed_version;
}

    ${g.items.map(bouton).join('')}
  `).join('')
  + (plus && plus.items.length ? `
    <button class="nav-more${ouvert?' open':''}" data-action="toggle-nav-more" aria-expanded="${ouvert}">
      <span class="ico">${ico('chevron')}</span>Plus
      ${!ouvert && enAttente ? `<span class="count">${enAttente}</span>` : ''}
    </button>
    <div class="nav-more-items"${ouvert?'':' hidden'}>${plus.items.map(bouton).join('')}</div>` : '');
}

/* Chaque écran a sa propre adresse (#produits, #inventaires…), pour trois raisons
   très concrètes en service : on peut mettre un écran précis en favori sur la
   tablette, le bouton Retour du navigateur fonctionne, et un lien envoyé à un
   collègue ouvre bien la page voulue et pas le tableau de bord. */
// Le titre d'un écran vient de PAGE_META, sauf pour ceux qui dépendent des
// catégories (fiches, carte) ou d'un élément précis (détail d'une fiche) : ceux-là
// sont construits à la volée.
function pageMeta(view){
  if(PAGE_META[view]) return PAGE_META[view];
  const c = categories().find(x=>recipesViewId(x.id)===view);
  if(c) return ['Fiches techniques — ' + c.label, categoryRecipesLabel(c)];
  const cc = categories().find(x=>catalogueViewId(x.id)===view);
  if(cc) return [cc.catalogue_label||'Vendus tels quels', 'Produits vendus tels quels, sans recette de composition'];
  return ['',''];
}
function isRoutableView(view){
  if(PAGE_META[view]) return true;
  if(view==='recipe-detail' || view==='product-detail') return true;
  return categories().some(c=>recipesViewId(c.id)===view || catalogueViewId(c.id)===view);
}
function viewToHash(view, id){ return '#' + view + (id ? '/' + encodeURIComponent(id) : ''); }
function hashToView(){
  const raw = (location.hash||'').replace(/^#/,'');
  if(!raw) return null;
  const slash = raw.indexOf('/');
  const view = slash === -1 ? raw : raw.slice(0, slash);
  const id = slash === -1 ? null : decodeURIComponent(raw.slice(slash+1));
  return isRoutableView(view) ? {view, id} : null;
}
function setView(view, id){
  if(view!=='inventory-detail') ui.invSearch = '';
  ui.view = view; ui.id = id||null;
  const target = viewToHash(view, id);
  // On écrit l'adresse sans déclencher hashchange (qui rappellerait render()).
  if(location.hash !== target){ suppressHashChange = true; location.hash = target; }
  render();
  window.scrollTo(0,0);
}

function render(){
  applyTheme();
  renderBrand();
  renderNav();
  const meta = pageMeta(ui.view);
  document.getElementById('page-title').textContent = meta[0];
  document.getElementById('page-desc').textContent = meta[1];
  const app = document.getElementById('app');
  const actions = document.getElementById('topbar-actions');
  actions.innerHTML = '';
  try{
    if(ui.view==='dashboard') app.innerHTML = viewDashboard();
    else if(ui.view==='margins') app.innerHTML = viewMargins();
    else if(ui.view==='history') app.innerHTML = viewHistory();
    else if(ui.view.startsWith('recipes-')) app.innerHTML = viewRecipeList(ui.view.slice('recipes-'.length));
    else if(ui.view.startsWith('catalogue')) app.innerHTML = viewCatalogue(ui.view.startsWith('catalogue-') ? ui.view.slice('catalogue-'.length) : null);
    else if(ui.view==='products') app.innerHTML = viewProducts();
    else if(ui.view==='suppliers') app.innerHTML = viewSuppliers();
    else if(ui.view==='reception') app.innerHTML = viewReception(actions);
    else if(ui.view==='sales') app.innerHTML = viewSales(actions);
    else if(ui.view==='stock') app.innerHTML = viewStock();
    else if(ui.view==='inventory-list') app.innerHTML = viewInventoryList();
    else if(ui.view==='losses') app.innerHTML = viewLosses();
    else if(ui.view==='inventory-detail') app.innerHTML = viewInventoryDetail(ui.id, actions);
    else if(ui.view==='orders') app.innerHTML = viewOrders();
    else if(ui.view==='print-batch') app.innerHTML = viewPrintBatch(ui.id, actions);
    else if(ui.view==='review') app.innerHTML = viewReview();
    else if(ui.view==='settings') app.innerHTML = viewSettings();
    else if(ui.view==='recipe-detail') app.innerHTML = viewRecipeDetail(ui.id, actions);
    else if(ui.view==='product-detail') app.innerHTML = viewProductDetail(ui.id);
    else app.innerHTML = '';
  }catch(err){
    app.innerHTML = `<div class="empty"><div class="big">${ico('alert', 40)}</div><h3>Une erreur est survenue</h3><p>${esc(err.message)}</p></div>`;
    console.error(err);
  }
}

/* ================= Historique ================= */
// Tout ce qui s'est passé dans le restaurant, reconstitué directement depuis les données
// déjà suivies ailleurs (prix fournisseurs, mouvements de stock, inventaires) plus le
// journal dédié aux mises/sorties de carte des fiches (le seul événement sans autre trace).
// Aucune instrumentation séparée à maintenir pour le reste : toujours complet, même pour
// l'historique antérieur à cette fonctionnalité.
function stockMoveLabel(m){
  const map = {reception:'📦 Réception', vente:'🧾 Vente', perte:'⚠ Perte', casse:'⚠ Casse', ajustement:'✎ Réglage manuel', inventaire:'☑ Écart d’inventaire'};
  const lbl = map[m.type] || m.type;
  const sign = m.qty>0?'+':'';
  return `${lbl} (${sign}${fmtNum(m.qty,2)})`;
}
function buildHistoryEntries(filterType){
  const entries = [];
  state.recipes.filter(r=>r.type==='recette').forEach(r=>{
    entries.push({date:r.date_iso, cat:'recipe', label:'Fiche', message:`Fiche créée : ${r.name}`, recipe_id:r.id});
  });
  (state.recipe_status_log||[]).forEach(e=>{
    const r = state.recipes.find(x=>x.id===e.recipe_id);
    // e.status : nouveau format (à la carte / en test / hors carte). e.active (booléen) est
    // l'ancien format, avant l'ajout du statut « en test » — toujours lisible pour ne pas
    // perdre les entrées déjà enregistrées.
    const st = e.status || (e.active ? 'active' : 'archived');
    const label = RECIPE_STATUS_LABELS[st] || st;
    entries.push({date:e.date, cat:'recipe', label:'Fiche', message:`Statut changé en « ${label} » : ${r?r.name:'(fiche supprimée)'}`, recipe_id:e.recipe_id});
  });
  state.products.forEach(p=>{
    (p.suppliers||[]).forEach(s=>{
      (s.history||[]).forEach(h=>{
        entries.push({date:h.date, cat:'price', label:'Prix', message:`${p.name} — ${s.name} : ${fmtMoney(h.price)}${h.note?' · '+h.note:''}`, product_id:p.id});
      });
    });
    (p.stock_movements||[]).forEach(m=>{
      entries.push({date:m.date, cat:'stock', label:'Stock', message: stockMoveLabel(m)+' — '+p.name+(m.note?' · '+m.note:''), product_id:p.id});
    });
  });
  (state.inventories||[]).forEach(inv=>{
    const catLabel = categoryLabel(inv.category);
    const zoneLabel = inv.zone && inv.zone!=='all' ? ' · '+inv.zone : '';
    entries.push({date:inv.created_at||inv.date, cat:'inventory', label:'Inventaire', message:`Inventaire lancé (${catLabel}${zoneLabel})`, inventory_id:inv.id});
    if(inv.status==='validated' && inv.validated_at){
      entries.push({date:inv.validated_at, cat:'inventory', label:'Inventaire', message:`Inventaire du ${fmtDate(inv.date)} validé`, inventory_id:inv.id});
    }
  });
  entries.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return (filterType && filterType!=='all') ? entries.filter(e=>e.cat===filterType) : entries;
}
function viewHistory(){
  const filter = ui.historyFilter || 'all';
  const entries = buildHistoryEntries(filter);
  const TYPES = [['all','Tout'],['recipe','Fiches'],['price','Prix d’achat'],['stock','Stock'],['inventory','Inventaires']];
  return `
  <div class="toolbar">
    <select class="pill" data-onchange="historyFilter">
      ${TYPES.map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}
    </select>
    <div class="spacer"></div>
    <span class="hint">${entries.length} événement${entries.length>1?'s':''}</span>
  </div>
  ${entries.length ? `
  <div class="tablewrap"><table>
    <thead><tr><th>Date</th><th>Type</th><th>Détail</th></tr></thead>
    <tbody>
    ${entries.map(e=>`
      <tr class="${(e.recipe_id||e.product_id||e.inventory_id)?'clickable':''}" ${e.recipe_id?`data-goto-recipe="${e.recipe_id}"`:''}${e.product_id?`data-goto-product="${e.product_id}"`:''}${e.inventory_id?`data-goto-inventory="${e.inventory_id}"`:''}>
        <td>${fmtDate(e.date)}</td>
        <td><span class="pill pill-neutral">${e.label}</span></td>
        <td>${esc(e.message)}</td>
      </tr>`).join('')}
    </tbody>
  </table></div>` : `<div class="card empty"><div class="big">${ico('history', 40)}</div><h3>Aucun événement pour l’instant</h3><p>Toute l’activité du restaurant (fiches, prix, stock, inventaires) apparaîtra ici au fur et à mesure.</p></div>`}
  `;
}

/* ================= Dashboard ================= */
function viewDashboard(){
  // Une carte de comptage par catégorie définie dans les Réglages, plus les marges
  // calculées sur l'ensemble des fiches — quelle que soit la catégorie.
  const perCategory = categories().map(c=>({
    cat: c,
    recipes: state.recipes.filter(r=>r.category===c.id && r.type==='recette'),
    catalogues: state.recipes.filter(r=>r.category===c.id && r.type==='catalogue'),
  }));
  const allRecipes = state.recipes.filter(r=>r.type==='recette');
  const withMargin = allRecipes.map(r=>({r, t:recipeTotals(r)})).filter(x=>x.t.foodPct!=null);
  // Exclut les fiches à problème (food cost aberrant, préparation en lot pas encore
  // chiffrée...) : ce compteur doit refléter de vraies marges à surveiller, pas des
  // données à corriger — ces dernières sont déjà signalées à part (badge « à vérifier »).
  const atRisk = withMargin.filter(x=>isRecipeActive(x.r) && marginStatus(x.t.foodPct)!=='good' && !x.r.needs_review && x.t.foodPct<=150);

  // recent price moves (on each product's primary/retained supplier)
  const moves = [];
  state.products.forEach(p=>{
    const s = primarySupplier(p);
    if(s && s.history && s.history.length>1){
      const last = s.history[s.history.length-1];
      const prev = s.history[s.history.length-2];
      moves.push({p, last, prev, delta: last.price-prev.price});
    }
  });
  moves.sort((a,b)=> (b.last.date||'').localeCompare(a.last.date||''));
  const recentMoves = moves.slice(0,7);

  const plausible = withMargin.filter(x=>isRecipeActive(x.r) && x.t.foodPct<=150 && !x.r.needs_review);
  const dataIssues = withMargin.filter(x=>x.t.foodPct>150 || x.r.needs_review);
  const worst = plausible.slice().sort((a,b)=> (b.t.foodPct)-(a.t.foodPct)).slice(0,6);
  const batchCount = state.recipes.filter(isBatchRecipe).length;
  const plausiblePct = plausible.map(x=>x.t.foodPct).sort((a,b)=>a-b);
  const avgFoodPct = plausiblePct.length ? median(plausiblePct) : null;
  const sk = stockKpis();
  const hh = hhSettings();
  const hhNow = isHappyHourNow();
  const hhRecipeCount = state.recipes.filter(r=>r.happy_hour_price!=null).length;

  // Ce que l'appli attend de vous, et rien d'autre : chaque ligne disparaît une
  // fois traitée. Un tableau de bord qui affiche en permanence des compteurs
  // qu'on ne peut pas actionner finit par ne plus être lu.
  const todo = [];
  if(reviewTotal()) todo.push({n:reviewTotal(), txt:'point(s) de données à vérifier', view:'review'});
  if(sk.lowCount) todo.push({n:sk.lowCount, txt:'produit(s) sous le seuil bas à commander', view:'stock'});
  const noPrice = allRecipes.filter(r=>!r.pv_ttc).length;
  if(noPrice) todo.push({n:noPrice, txt:'fiche(s) sans prix de vente', view:'margins'});
  if(atRisk.length) todo.push({n:atRisk.length, txt:'fiche(s) dont la marge est trop faible', view:'margins'});

  const marges = plausible.map(x=>x.t.marge).filter(v=>v!=null);
  const margeMoy = marges.length ? marges.reduce((a,b)=>a+b,0)/marges.length : null;
  const avgBased = state.products.filter(p=>averagePrice(p)!=null).length;

  return `
  ${todo.length ? `
  <div class="card" style="padding:14px 16px;margin-bottom:16px;">
    <div class="label" style="margin-bottom:8px;">À faire</div>
    <div style="display:flex;flex-direction:column;gap:7px;">
      ${todo.map(t=>`<div class="clickable" data-nav="${t.view}" style="cursor:pointer;display:flex;align-items:baseline;gap:9px;">
        <span style="font-size:19px;font-weight:600;color:var(--warning);min-width:38px;">${t.n}</span>
        <span>${t.txt}</span></div>`).join('')}
    </div>
  </div>` : ''}

  <div class="kpi-row">
    <div class="card kpi clickable" data-nav="margins" style="cursor:pointer;"><div class="label">Food cost médian</div><div class="value">${fmtPct(avgFoodPct)}</div><div class="note">la moitié des fiches font mieux · seuil ${state.settings.margin_alert_pct} %</div></div>
    <div class="card kpi clickable" data-nav="margins" style="cursor:pointer;"><div class="label">Marge moyenne</div><div class="value">${fmtMoney(margeMoy)}</div><div class="note">gagné en moyenne sur une fiche vendue</div></div>
    <div class="card kpi clickable" data-nav="stock" style="cursor:pointer;"><div class="label">Valeur du stock</div><div class="value">${fmtMoney(sk.totalVal)}</div><div class="note">immobilisé dans les réserves</div></div>
    ${hh.enabled ? `<div class="card kpi clickable" data-nav="settings" style="cursor:pointer;${hhNow?'background:var(--warning-wash);':''}"><div class="label">Happy Hour</div><div class="value" style="color:${hhNow?'var(--warning)':'var(--good)'}">${hhNow?'En cours':'Inactif'}</div><div class="note">${hh.start} – ${hh.end} · ${hhRecipeCount} fiche(s)</div></div>` : ''}
  </div>

  <div class="hint" style="margin:-4px 0 18px;">
    Les coûts sont calculés sur le <strong>prix moyen pondéré</strong> de ce que vous avez réellement payé, dès que deux livraisons au moins ont été saisies pour un produit — ${avgBased} produit(s) aujourd'hui. Pour les autres, c'est le dernier prix connu.
  </div>

  <div class="section">
    <div class="section-head"><h2>Dernières variations de prix d’achat</h2><span class="hint">reconstituées depuis les dates des fiches + vos mises à jour</span></div>
    ${recentMoves.length ? `
    <div class="tablewrap"><table>
      <thead><tr><th>Produit</th><th>Date</th><th class="num">Ancien prix</th><th class="num">Nouveau prix</th><th class="num">Variation</th></tr></thead>
      <tbody>
        ${recentMoves.map(m=>`
          <tr class="clickable" data-goto-product="${m.p.id}">
            <td>${esc(m.p.name)}</td>
            <td>${fmtDate(m.last.date)}</td>
            <td class="num">${fmtMoney(m.prev.price)}</td>
            <td class="num">${fmtMoney(m.last.price)}</td>
            <td class="num trend ${m.delta>0.0001?'up':m.delta<-0.0001?'down':'flat'}">${m.delta>0?'▲':m.delta<0?'▼':'—'} ${fmtMoney(Math.abs(m.delta))}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>` : `<div class="card empty"><div class="big">${ico('chart', 40)}</div><h3>Aucune variation pour l’instant</h3><p>Modifiez le prix d’un produit pour commencer à suivre son évolution.</p></div>`}
  </div>

  <div class="section">
    <div class="section-head"><h2>Recettes les plus sensibles</h2><span class="hint">food cost le plus élevé en premier</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Recette</th><th class="num">PV TTC ${tip('pvttc')}</th><th class="num">PRP ${tip('prp')}</th><th class="num">Marge ${tip('marge')}</th><th class="num">Food cost ${tip('foodcost')}</th><th>État</th></tr></thead>
      <tbody>
        ${worst.map(x=>`
          <tr class="clickable" data-goto-recipe="${x.r.id}">
            <td>${esc(x.r.name)}</td>
            <td class="num">${fmtMoney(x.t.pv_ttc)}</td>
            <td class="num">${fmtMoney(x.t.prp)}</td>
            <td class="num">${fmtMoney(x.t.marge)}</td>
            <td class="num">${fmtPct(x.t.foodPct)}</td>
            <td>${pillFor(marginStatus(x.t.foodPct))}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>
    ${dataIssues.length ? `<div class="hint" style="margin-top:10px;">⚠ ${dataIssues.length} recette${dataIssues.length>1?'s':''} avec des données d’import incomplètes (quantités ou prix de vente manquants) — repérables au badge <span class="badge-flag">à vérifier</span> dans les listes de fiches.</div>` : ''}
    ${batchCount ? `<div class="hint" style="margin-top:6px;">${ico('flask',14)} ${batchCount} recette${batchCount>1?'s':''} préparée${batchCount>1?'s':''} en lot (plusieurs bouteilles/portions à partir d’une même préparation) — repérables au badge <span class="badge-batch">lot</span>, leur total a été recalé sur la valeur d’origine de la fiche pour éviter un double comptage des ingrédients de base.</div>` : ''}
  </div>
  `;
}
function pillFor(status){
  const cls = {good:'pill-good',warning:'pill-warning',critical:'pill-critical',neutral:'pill-neutral'}[status];
  return `<span class="pill ${cls}">${statusLabel(status)}</span>`;
}

/* ================= Margins view ================= */
function viewMargins(){
  let rows = state.recipes.filter(r=>r.type==='recette').map(r=>({r,t:recipeTotals(r)}));
  rows.forEach(x=>{ x.dataIssue = x.r.needs_review || (x.t.foodPct!=null && x.t.foodPct>150); });
  const atRiskFiltered = ui.marginFilter==='atRisk';
  if(atRiskFiltered){
    rows = rows.filter(x=> isRecipeActive(x.r) && !x.dataIssue && marginStatus(x.t.foodPct)!=='good');
  }
  rows.sort((a,b)=>{
    const ka = ui.marginSort==='foodpct'? (a.t.foodPct??-1) : ui.marginSort==='marge'? (a.t.marge??-999) : (a.t.coeff??-1);
    const kb = ui.marginSort==='foodpct'? (b.t.foodPct??-1) : ui.marginSort==='marge'? (b.t.marge??-999) : (b.t.coeff??-1);
    return ui.marginSort==='marge' ? ka-kb : kb-ka;
  });
  // Un écran qui n'est qu'un tableau ne dit rien tant qu'on ne l'a pas lu en
  // entier. Trois chiffres en tête donnent la réponse avant de descendre.
  const chiffrees = rows.filter(x=>x.t.foodPct!=null && !x.dataIssue && isRecipeActive(x.r));
  const sousSeuil = chiffrees.filter(x=>marginStatus(x.t.foodPct)==='critical').length;
  const aSurveiller = chiffrees.filter(x=>marginStatus(x.t.foodPct)==='warning').length;
  const margeTot = chiffrees.reduce((n,x)=>n+(x.t.marge||0),0);
  const kpis = `<div class="kpi-row">
    <div class="card kpi"><div class="label">Fiches sous le seuil</div><div class="value" style="color:${sousSeuil?'var(--critical)':'var(--good)'};">${sousSeuil}</div><div class="note">marge insuffisante, à revoir</div></div>
    <div class="card kpi"><div class="label">À surveiller</div><div class="value" style="color:${aSurveiller?'var(--warning)':'var(--good)'};">${aSurveiller}</div><div class="note">proches de la limite</div></div>
    <div class="card kpi"><div class="label">Marge cumulée</div><div class="value">${fmtMoney(margeTot)}</div><div class="note">si chaque fiche était vendue une fois</div></div>
  </div>`;
  return kpis + `
  <div class="toolbar">
    <select class="pill" data-onchange="marginSort">
      <option value="foodpct" ${ui.marginSort==='foodpct'?'selected':''}>Trier par food cost %</option>
      <option value="marge" ${ui.marginSort==='marge'?'selected':''}>Trier par marge (croissant)</option>
      <option value="coeff" ${ui.marginSort==='coeff'?'selected':''}>Trier par coefficient</option>
    </select>
    ${atRiskFiltered ? `<span class="pill pill-warning">Filtré : recettes à surveiller (${rows.length})</span><button class="btn btn-sm" data-action="reset-margin-filter">Voir toutes les recettes</button>` : ''}
    <div class="spacer"></div>
    <span class="hint">Seuil d’alerte : food cost &gt; ${state.settings.margin_alert_pct}%</span>
  </div>
  <div class="tablewrap"><table>
    <thead><tr><th>Recette</th><th>Catégorie</th><th class="num">PV TTC ${tip('pvttc')}</th><th class="num">PV HT ${tip('pvht')}</th><th class="num">PRP ${tip('prp')}</th><th class="num">Marge HT ${tip('marge')}</th><th class="num">Coeff. ${tip('coeff')}</th><th class="num">Food cost ${tip('foodcost')}</th><th>État</th></tr></thead>
    <tbody>
      ${rows.map(x=>{
        // Un food cost très élevé (>150%) signale presque toujours un problème de fiche
        // (préparation en lot pas encore chiffrée, ingrédients en double...) plutôt qu'une
        // vraie mauvaise marge — on le distingue clairement pour ne pas laisser croire que
        // ce sont vos pires marges alors que ce sont des données à corriger.
        const dataIssue = x.dataIssue;
        return `
        <tr class="clickable" data-goto-recipe="${x.r.id}">
          <td>${esc(x.r.name)} ${isBatchRecipe(x.r)?('<span class="badge-batch">' + ico('flask',13) + ' lot</span>'):''}</td>
          <td>${esc(categoryLabel(x.r.category))}</td>
          <td class="num">${fmtMoney(x.t.pv_ttc)}</td>
          <td class="num">${fmtMoney(x.t.pv_ht)}</td>
          <td class="num">${fmtMoney(x.t.prp)}</td>
          <td class="num">${fmtMoney(x.t.marge)}</td>
          <td class="num">${x.t.coeff!=null? fmtNum(x.t.coeff,2):'—'}</td>
          <td class="num">${fmtPct(x.t.foodPct)}</td>
          <td>${dataIssue
            ? `<span class="badge-flag" title="Ce chiffre est faussé par un problème de fiche (préparation en lot non chiffrée, ingrédients en double…), pas par une vraie mauvaise marge.">à vérifier</span>`
            : pillFor(marginStatus(x.t.foodPct))}</td>
        </tr>`;}).join('')}
    </tbody>
  </table></div>
  `;
}

/* ================= Recipe list (bar / cuisine) ================= */
function recipeStatusSelectHTML(r, extraStyle){
  return `<select class="pill" style="${extraStyle||''}" data-onchange="recipe-status" data-rid="${r.id}" title="Changer le statut de la fiche">

/* ================= Stock ================= */
function distinctZones(){
  const set = new Set();
  state.products.forEach(p=>{ if(p.storage_zone) set.add(p.storage_zone); });
  (state.settings.storage_zones||[]).forEach(z=>set.add(z));
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'fr'));
}
/* ================= Réception du jour =================
   Le geste quotidien, réduit au strict nécessaire : QUI a livré (choisi une fois
   en haut, car une livraison = un fournisseur), puis pour chaque produit COMBIEN
   et À QUEL PRIX — le prix tel qu'il est lu sur le bon de livraison, au kilo ou
   au litre, jamais au format d'achat.

   Une seule liste, à plat, sans filtre ni regroupement : dès qu'un fournisseur est
   choisi, on n'affiche que ce qu'il livre habituellement, le plus souvent reçu en
   premier. C'est ce qui rend la saisie possible d'une main pendant la livraison.

   Deux effets, invisibles pour l'équipe : la quantité alimente le stock, le prix
   alimente l'historique fournisseur — d'où le meilleur fournisseur calculé seul. */
function lastMovementDate(p){
  const ms = p.stock_movements||[];
  return ms.length ? ms.reduce((acc,m)=> (m.date||'') > acc ? (m.date||'') : acc, '') : '';
}
function receptionCount(p){
  return (p.stock_movements||[]).filter(m=>m.type==='reception').length;
}
/* ---- Convertisseur de quantité ----
   Le bon de livraison parle en bouteilles, en kilos ou en cartons ; le stock,
   lui, vit en cl, en g ou à l'unité. Faire la conversion de tête à chaque ligne,
   c'est la garantie que le stock dérive. On laisse donc saisir dans l'unité du
   bon, et l'appli convertit. */
function qtyUnitOptions(p){
  const opts = [];
  if(p.base_unit==='g')       opts.push({v:'g',  l:'g',  f:1}, {v:'kg', l:'kg', f:1000});
  else if(p.base_unit==='cl') opts.push({v:'cl', l:'cl', f:1}, {v:'L',  l:'L',  f:100});
  else                        opts.push({v:'unite', l:'unité', f:1});
  if(p.purchase_size>1){
    opts.push({v:'colis', l:(purchaseFormatLabel(p)||'colis'), f:p.purchase_size});
  }
  return opts;
}
function qtyFactor(p, unitValue){
  const o = qtyUnitOptions(p).find(x=>x.v===unitValue);
  return o ? o.f : 1;
}
function qtyUnitSelectHTML(p, selected, attr){
  const opts = qtyUnitOptions(p);
  if(opts.length<2) return `<div class="hint" style="font-size:11px;">${esc(opts[0].l)}</div>`;
  return `<select ${attr} style="margin-top:3px;font-size:11px;padding:2px 4px;max-width:104px;">
    ${opts.map(o=>`<option value="${esc(o.v)}" ${selected===o.v?'selected':''}>${esc(o.l)}</option>`).join('')}
  </select>`;
}
/* ---- Garde-fou sur les quantités ----
   Deuxième filet après la virgule : on compare ce qui vient d'être saisi à ce que
   ce produit reçoit d'habitude. Un facteur 10 en trop (virgule oubliée, unité
   confondue) devient visible avant validation, pas trois semaines plus tard à
   l'inventaire. On alerte, on ne bloque jamais : une grosse commande annuelle est
   légitime, et c'est l'équipe qui sait. */
function usualQty(p){
  const qs = (p.stock_movements||[]).filter(m=>m.type==='reception' && m.qty>0).map(m=>m.qty).sort((a,b)=>a-b);
  return qs.length>=2 ? median(qs) : null;
}
function qtyWarning(p, qty){
  const u = usualQty(p);
  if(u==null || !(qty>0)) return null;
  const ratio = qty / u;
  if(ratio >= 5)  return `⚠ ${fmtNum(ratio,0)}× la livraison habituelle (~${fmtNum(u,2)} ${stockUnitLabel(p)})`;
  if(ratio <= 0.2) return `⚠ bien moins que d’habitude (~${fmtNum(u,2)} ${stockUnitLabel(p)})`;
  return null;
}
function recEntry(pid){
  ui.recDraft = ui.recDraft || {};
  return ui.recDraft[pid] || (ui.recDraft[pid] = {});
}
function recIsFilled(e){ return !!e && ((e.qty>0) || (e.price>0)); }
function receptionEnteredIds(){
  const d = ui.recDraft||{};
  return Object.keys(d).filter(id=>recIsFilled(d[id]) && productById(id));
}
function suppliesProduct(p, name){ return (p.suppliers||[]).some(s=>s.name===name); }
// Une seule barre pour tout : on tape « coriandre » ou « aristide », l'appli
// cherche dans les deux. Personne n'a à savoir dans quel champ chercher quoi.
function receptionMatch(p, q){
  if(p.name.toLowerCase().includes(q)) return true;
  return (p.suppliers||[]).some(s=>(s.name||'').toLowerCase().includes(q));
}
// Fournisseurs dont le nom correspond à la recherche : proposés en un clic.
function supplierSuggestions(q){
  if(!q || q.length<2) return [];
  return allSupplierNames().filter(n=>n.toLowerCase().includes(q)).slice(0,4);
}
function receptionProducts(){
  const q = (ui.recSearch||'').trim().toLowerCase();
  const filled = new Set(receptionEnteredIds());
  const sup = (ui.recSupplier && ui.recSupplier!=='all') ? ui.recSupplier : null;
  let list, mode;
  if(q){
    mode = 'search';
    list = state.products.filter(p=>filled.has(p.id) || receptionMatch(p, q));
  } else if(sup){
    mode = 'supplier';
    list = state.products.filter(p=>filled.has(p.id) || suppliesProduct(p, sup));
  } else {
    mode = 'frequent';
    list = state.products.filter(p=>filled.has(p.id) || receptionCount(p)>0 || lastMovementDate(p));
  }
  list.sort((a,b)=>
    receptionCount(b)-receptionCount(a) ||
    lastMovementDate(b).localeCompare(lastMovementDate(a)) ||
    a.name.localeCompare(b.name,'fr'));
  if(mode==='frequent') list = list.slice(0, 30);
  return {list, mode};
}
function receptionSummaryHTML(){
  const ids = receptionEnteredIds();
  if(!ids.length) return '';
  let total = 0, prices = 0;
  ids.forEach(id=>{
    const p = productById(id), e = ui.recDraft[id];
    if(e.qty>0) total += (valueForQty(p, e.qty)||0);
    if(e.price>0) prices++;
  });
  return `<div class="kpi-row" style="margin-top:14px;">
    <div class="card kpi"><div class="label">Lignes saisies</div><div class="value">${ids.length}</div><div class="note">${prices} prix mis à jour</div></div>
    <div class="card kpi"><div class="label">Valeur estimée</div><div class="value">${fmtMoney(total)}</div><div class="note">à rapprocher du bon de livraison</div></div>
  </div>`;
}
