/* ================= Event delegation ================= */
function closeMobileNav(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');
}
function toggleMobileNav(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}
document.getElementById('menu-toggle').addEventListener('click', toggleMobileNav);
document.getElementById('sidebar-backdrop').addEventListener('click', closeMobileNav);

document.addEventListener('click', function(e){
  // Info-bulles : un tap sur le ⓘ l'ouvre/le ferme (pas de survol sur tablette tactile) ;
  // un tap ailleurs referme celles qui étaient ouvertes.
  const tipHit = e.target.closest('.info-tip');
  document.querySelectorAll('.info-tip.show').forEach(el=>{ if(el!==tipHit) el.classList.remove('show'); });
  if(tipHit){ tipHit.classList.toggle('show'); e.stopPropagation(); return; }

  const nav = e.target.closest('[data-nav]');
  if(nav){ closeMobileNav(); if(nav.dataset.nav==='margins') ui.marginFilter='all'; setView(nav.dataset.nav); return; }

  const back = e.target.closest('[data-action="back"]');
  if(back){ setView(back.dataset.view); return; }

  const insideRowStop = e.target.closest('td[data-stop]');

  const gotoRecipe = !insideRowStop && e.target.closest('[data-goto-recipe]');
  if(gotoRecipe){ setView('recipe-detail', gotoRecipe.dataset.gotoRecipe); return; }

  const gotoProduct = !insideRowStop && e.target.closest('[data-goto-product]');
  if(gotoProduct){ e.preventDefault(); setView('product-detail', gotoProduct.dataset.gotoProduct); return; }

  const gotoInventory = !insideRowStop && e.target.closest('[data-goto-inventory]');
  if(gotoInventory){ setView('inventory-detail', gotoInventory.dataset.gotoInventory); return; }

  const gotoSupplier = !insideRowStop && e.target.closest('[data-goto-supplier]');
  if(gotoSupplier){ ui.fournisseurFilter = gotoSupplier.dataset.gotoSupplier; ui.search = ''; setView('products'); return; }

  const bg = e.target.closest('[data-action="overlay-bg"]');
  if(bg && !e.target.closest('[data-stop]')){ closeOverlay(); return; }

  const closeBtn = e.target.closest('[data-action="close"]');
  if(closeBtn){ closeOverlay(); return; }

  const act = e.target.closest('[data-action]');
  if(!act) return;
  const a = act.dataset.action;

  if(a==='reload-shared') return location.reload();
  if(a==='dismiss-remote'){ const b=document.getElementById('remote-banner'); if(b) b.remove(); return; }
  if(a==='sign-out'){
    if(!confirm('Se déconnecter ? Il faudra saisir à nouveau l’identifiant de l’équipe.')) return;
    sbClient.auth.signOut().then(()=>location.reload());
    return;
  }
  if(a==='export-backup') return exportBackup();
  if(a==='import-backup') return importBackup();
  if(a==='view-atrisk'){ ui.marginFilter='atRisk'; setView('margins'); return; }
  if(a==='reset-margin-filter'){ ui.marginFilter='all'; render(); return; }
  if(a==='new-product') return modalNewProduct();
  if(a==='add-supplier-price') return modalAddSupplierPrice(act.dataset.id, act.dataset.sid);
  if(a==='new-supplier') return modalNewSupplier(act.dataset.id);
  if(a==='rename-supplier') return modalRenameSupplier(act.dataset.id, act.dataset.sid);
  if(a==='edit-product-meta') return modalEditProductMeta(act.dataset.id);
  if(a==='new-recipe') return modalNewRecipe(act.dataset.cat);
  if(a==='edit-recipe-meta') return modalEditRecipeMeta(act.dataset.id);
  if(a==='add-ingredient') return modalAddIngredient(act.dataset.rid);
  if(a==='edit-ingredient') return modalEditIngredient(act.dataset.rid, parseInt(act.dataset.idx,10));
  if(a==='print-recipe'){ setView('recipe-detail', act.dataset.id); setTimeout(()=>window.print(), 120); return; }
  if(a==='print-batch'){ setView('print-batch', act.dataset.cat||'all'); return; }
  if(a==='do-print'){ window.print(); return; }
  if(a==='stock-movement') return modalStockMovement(act.dataset.id);
  if(a==='stock-settings') return modalStockSettings(act.dataset.id);
  if(a==='delete-category'){
    const idx = parseInt(act.dataset.idx,10);
    const c = categories()[idx];
    if(!c) return;
    if(categories().length<=1){ alert('Il faut au moins une catégorie.'); return; }
    const used = state.products.filter(p=>p.category===c.id).length + state.recipes.filter(r=>r.category===c.id).length;
    if(used){
      alert(`« ${c.label} » contient encore ${used} produit(s)/fiche(s). Déplacez-les vers une autre catégorie avant de la supprimer.`);
      return;
    }
    if(!confirm(`Supprimer la catégorie « ${c.label} » ?`)) return;
    state.settings.categories.splice(idx,1);
    if(ui.view===recipesViewId(c.id) || ui.view===catalogueViewId(c.id)) ui.view='dashboard';
    scheduleSave(); render(); return;
  }
  if(a==='recipe-photo'){
    ui.photoTarget = act.dataset.rid;
    const inp = document.getElementById('recipe-photo-input');
    if(inp){ inp.value = ''; inp.click(); }
    return;
  }
  if(a==='recipe-photo-remove'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    if(!r || !confirm('Retirer la photo de cette fiche ?')) return;
    delete r.photo;
    scheduleSave(); render(); return;
  }
  if(a==='onb-back'){ showOnboarding(Math.max(0, (ui.onbStep||0)-1)); return; }
  if(a==='onb-add-cat'){
    const form = document.getElementById('onb-form');
    if(form) saveOnboardingCategories(form);
    const label = 'Nouvelle activité';
    const base = 'activite'; let id = base, n = 2;
    while(categories().some(c=>c.id===id)) id = base + '-' + (n++);
    state.settings.categories.push({id, label, ico:'clipboard', recipes_label:'Fiches '+label.toLowerCase(), has_catalogue:false, catalogue_label:''});
    showOnboarding(2); return;
  }
  if(a==='onb-remove-cat'){
    const form = document.getElementById('onb-form');
    if(form) saveOnboardingCategories(form);
    const idx = parseInt(act.dataset.idx,10);
    const c = categories()[idx];
    if(c && categories().length>1){
      const used = state.products.filter(p=>p.category===c.id).length + state.recipes.filter(r=>r.category===c.id).length;
      if(used && !confirm(`« ${c.label} » contient ${used} élément(s). Les retirer de la liste les rendra invisibles. Continuer ?`)) return;
      state.settings.categories.splice(idx,1);
    }
    showOnboarding(2); return;
  }
  if(a==='show-onboarding'){ showOnboarding(0); return; }
  if(a==='review-correction-ok'){
    const r = state.recipes.find(x=>x.id===act.dataset.id);
    if(r){ r.correction_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-yield-ok'){
    const r = state.recipes.find(x=>x.id===act.dataset.id);
    if(r){ r.yield_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-drop-line'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    const idx = parseInt(act.dataset.idx,10);
    if(!r || !r.ingredients[idx]) return;
    const before = rawRecipeCost(r);
    r.ingredients.splice(idx,1);
    const after = rawRecipeCost(r);
    scheduleSave(); render();
    setSaveIndicator('pending', `Coût recalculé : ${fmtMoney(before)} → ${fmtMoney(after)}`);
    return;
  }
  if(a==='review-keep-line'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    const ing = r && r.ingredients[parseInt(act.dataset.idx,10)];
    if(ing){ ing.line_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-format-ok'){
    const p = productById(act.dataset.id);
    if(p){ p.format_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-price-ok'){
    const p = productById(act.dataset.id);
    if(p){ p.price_confirmed = true; scheduleSave(); render(); }
    return;
  }
  if(a==='review-keep-both'){
    state.settings.merge_dismissed = state.settings.merge_dismissed || [];
    if(!state.settings.merge_dismissed.includes(act.dataset.key)) state.settings.merge_dismissed.push(act.dataset.key);
    scheduleSave(); render();
    return;
  }
  if(a==='review-merge'){
    const keep = productById(act.dataset.keep), drop = productById(act.dataset.drop);
    if(!keep || !drop) return;
    if(!confirm(`Regrouper « ${drop.name} » dans « ${keep.name} » ?\n\nLes fiches, le stock et l’historique des prix seront reportés. Cette opération peut changer le coût des fiches concernées.`)) return;
    mergeProducts(keep, drop);
    scheduleSave(); render();
    return;
  }
  if(a==='sales-clear'){
    if(!salesEnteredIds().length) return;
    if(!confirm('Effacer la saisie en cours ? Le stock n’a pas encore été modifié.')) return;
    ui.salesDraft = {}; render(); return;
  }
  if(a==='sales-save'){
    const ids = salesEnteredIds();
    if(!ids.length) return;
    const date = ui.salesDate || todayISO();
    const cons = salesDraftConsumption();
    const total = ids.reduce((n,id)=>n+ui.salesDraft[id],0);
    const negatives = cons.filter(c=>(c.product.stock_qty||0) < c.qty).length;
    let msg = `Enregistrer ${total} vente(s) du ${fmtDate(date)} ? ${cons.length} produit(s) seront déduits du stock.`;
    if(negatives) msg += `\n\nAttention : ${negatives} produit(s) passeront en stock négatif — signe d'une réception oubliée ou d'un inventaire à refaire.`;
    if(!confirm(msg)) return;
    const label = `Ventes du ${fmtDate(date)} (${total} fiche(s))`;
    cons.forEach(c=>{ addStockMovement(c.product, 'vente', -Math.abs(c.qty), label, date); });
    state.salesLog = state.salesLog || [];
    state.salesLog.push({ id: uid('sale'), date, lines: clone(ui.salesDraft) });
    ui.salesDraft = {};
    scheduleSave(); render();
    return;
  }
  if(a==='reception-pick-supplier'){
    // Choisir le fournisseur depuis la recherche : on vide la recherche pour
    // basculer aussitôt sur sa liste habituelle, qui est le but recherché.
    ui.recSupplier = act.dataset.name;
    ui.recSearch = '';
    render(); return;
  }
  if(a==='reception-clear'){
    if(!receptionEnteredIds().length) return;
    if(!confirm('Effacer toute la saisie en cours ? Le stock n’a pas encore été modifié.')) return;
    ui.recDraft = {}; render(); return;
  }
  if(a==='reception-save'){
    const ids = receptionEnteredIds();
    if(!ids.length) return;
    const date = ui.recDate || todayISO();
    const who = ui.recSupplier;
    const withPrice = ids.filter(id=>ui.recDraft[id].price>0);
    if(withPrice.length && (!who || who==='all')){
      alert('Choisissez le fournisseur qui a livré avant d’enregistrer : un prix ne veut rien dire sans lui.');
      return;
    }
    const parts = [];
    const withQty = ids.filter(id=>ui.recDraft[id].qty>0);
    if(withQty.length) parts.push(`${withQty.length} quantité(s) ajoutée(s) au stock`);
    if(withPrice.length) parts.push(`${withPrice.length} prix enregistré(s) pour ${who}`);
    let msg = `Réception du ${fmtDate(date)} : ${parts.join(' et ')} ?`;
    // Dernier rappel des quantités inhabituelles : c'est le moment où l'on peut
    // encore corriger sans avoir à défaire un mouvement de stock.
    const odd = ids.map(id=>({p:productById(id), w:qtyWarning(productById(id), ui.recDraft[id].qty)}))
                   .filter(x=>x.w);
    if(odd.length){
      msg += '\n\nÀ vérifier avant de valider :\n' + odd.map(x=>`• ${x.p.name} — ${x.w.replace('⚠ ','')}`).join('\n');
    }
    if(!confirm(msg)) return;
    ids.forEach(id=>{
      const p = productById(id);
      const e = ui.recDraft[id];
      if(e.qty>0) addStockMovement(p, 'reception', Math.abs(e.qty), 'Réception du '+fmtDate(date), date);
      if(e.price>0){
        // Le prix saisi est au kilo/litre/unité ; on le reconvertit au format d'achat,
        // seule forme comprise par le reste de l'appli.
        const packPrice = round3(refToPackPrice(p, e.price));
        p.suppliers = p.suppliers || [];
        let sup = p.suppliers.find(s=>s.name===who);
        if(!sup){
          sup = { id: uid('s'), name: who, history: [] };
          p.suppliers.push(sup);
        }
        sup.history = sup.history || [];
        const last = sup.history[sup.history.length-1];
        // La quantité est conservée avec le prix : c'est elle qui rend la
        // moyenne pondérée possible, et donc les coûts stables.
        sup.history.push({ date, price: packPrice, qty: e.qty>0 ? e.qty : null, note: 'Saisi en réception' });
        if(!p.primary_supplier_id) p.primary_supplier_id = sup.id;
      }
    });
    ui.recDraft = {};
    scheduleSave(); render();
    return;
  }
  if(a==='new-inventory') return modalNewInventory();
  if(a==='print-inventory'){ setView('inventory-detail', act.dataset.id); setTimeout(()=>window.print(), 120); return; }
  if(a==='validate-inventory'){
    const inv = (state.inventories||[]).find(x=>x.id===act.dataset.id);
    if(!inv || inv.status!=='in_progress') return;
    const uncounted = inv.counts.filter(c=>c.counted_qty==null).length;
    if(uncounted>0 && !confirm(uncounted+' produit(s) non compté(s) seront ignorés (stock inchangé). Valider quand même ?')) return;
    inv.counts.forEach(c=>{
      if(c.counted_qty==null) return;
      const p = productById(c.product_id);
      if(!p) return;
      const variance = round3(c.counted_qty - c.theoretical_qty);
      if(Math.abs(variance)>1e-9){
        addStockMovement(p, 'inventaire', variance, 'Écart inventaire du '+fmtDate(inv.date), inv.date);
      } else {
        p.stock_qty = c.counted_qty;
      }
    });
    inv.status = 'validated'; inv.validated_at = todayISO();
    scheduleSave(); render(); return;
  }
  if(a==='delete-inventory'){
    const idx = (state.inventories||[]).findIndex(x=>x.id===act.dataset.id);
    if(idx<0) return;
    if(!confirm('Supprimer cet inventaire (comptage non enregistré) ?')) return;
    state.inventories.splice(idx,1);
    closeOverlay(); scheduleSave(); setView('inventory-list'); return;
  }
  if(a==='add-product-to-inventory'){
    const inv = (state.inventories||[]).find(x=>x.id===act.dataset.inv);
    const p = productById(act.dataset.pid);
    if(inv && p && inv.status==='in_progress' && !inv.counts.some(c=>c.product_id===p.id)){
      inv.counts.push({ product_id:p.id, theoretical_qty: p.stock_qty||0, counted_qty:null });
      ui.invSearch = '';
      scheduleSave(); render();
    }
    return;
  }
  if(a==='remove-product-from-inventory'){
    const inv = (state.inventories||[]).find(x=>x.id===act.dataset.inv);
    if(inv && inv.status==='in_progress'){
      const idx = inv.counts.findIndex(c=>c.product_id===act.dataset.pid);
      if(idx>=0){ inv.counts.splice(idx,1); scheduleSave(); render(); }
    }
    return;
  }
  if(a==='quick-new-product-inventory'){ return modalNewProduct(act.dataset.inv, ui.invSearch); }

  if(a==='toggle-allergen'){
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    const code = act.dataset.code;
    r.allergens = r.allergens || [];
    const i = r.allergens.indexOf(code);
    if(i>=0) r.allergens.splice(i,1); else r.allergens.push(code);
    scheduleSave(); render(); return;
  }
  if(a==='delete-supplier-price'){
    const p = productById(act.dataset.id);
    const s = p.suppliers.find(x=>x.id===act.dataset.sid);
    const idx = parseInt(act.dataset.idx,10);
    if(!s || s.history.length<=1) return;
    if(!confirm('Supprimer ce point de prix historique ?')) return;
    s.history.splice(idx,1);
    scheduleSave(); render(); return;
  }
  if(a==='set-primary-supplier'){
    const p = productById(act.dataset.id);
    p.primary_supplier_id = act.dataset.sid;
    scheduleSave(); render(); return;
  }
  if(a==='delete-supplier'){
    const p = productById(act.dataset.id);
    if(p.suppliers.length<=1) return;
    if(!confirm('Supprimer ce fournisseur et son historique de prix pour ce produit ?')) return;
    const idx = p.suppliers.findIndex(x=>x.id===act.dataset.sid);
    if(idx<0) return;
    p.suppliers.splice(idx,1);
    if(p.primary_supplier_id===act.dataset.sid){ p.primary_supplier_id = p.suppliers[0].id; }
    scheduleSave(); render(); return;
  }
  if(a==='delete-ingredient'){
    if(!confirm('Retirer cet ingrédient de la recette ?')) return;
    const r = state.recipes.find(x=>x.id===act.dataset.rid);
    r.ingredients.splice(parseInt(act.dataset.idx,10),1);
    closeOverlay(); scheduleSave(); render(); return;
  }
  if(a==='delete-recipe'){
    if(!confirm('Supprimer définitivement cette fiche ?')) return;
    const idx = state.recipes.findIndex(x=>x.id===act.dataset.id);
    const cat = state.recipes[idx].category;
    state.recipes.splice(idx,1);
    closeOverlay(); scheduleSave(); setView(recipesViewId(cat)); return;
  }
  if(a==='delete-product'){
    const used = recipesUsingProduct(act.dataset.id);
    if(used.length){ alert('Impossible de supprimer : ce produit est utilisé dans ' + used.length + ' recette(s). Retirez-le des recettes d’abord.'); return; }
    if(!confirm('Supprimer définitivement ce produit ?')) return;
    const idx = state.products.findIndex(x=>x.id===act.dataset.id);
    state.products.splice(idx,1);
    closeOverlay(); scheduleSave(); setView('products'); return;
  }
  if(a==='delete-storage-zone'){
    const idx = parseInt(act.dataset.idx,10);
    const zone = (state.settings.storage_zones||[])[idx];
    if(zone!=null){
      const inUse = state.products.some(p=>p.storage_zone===zone);
      if(inUse && !confirm(`Des produits utilisent encore la zone “${zone}” — la supprimer de la liste ne les déclasse pas. Continuer ?`)) return;
      state.settings.storage_zones.splice(idx,1);
      scheduleSave(); render();
    }
    return;
  }
});

document.addEventListener('input', function(e){
  const t = e.target;
  if(t.matches('[data-oninput="search"]')){ ui.search = t.value; render(); const el=document.querySelector('[data-oninput="search"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="stockSearch"]')){ ui.stockSearch = t.value; render(); const el=document.querySelector('[data-oninput="stockSearch"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="invSearch"]')){ ui.invSearch = t.value; render(); const el=document.querySelector('[data-oninput="invSearch"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="salesSearch"]')){ ui.salesSearch = t.value; render(); const el=document.querySelector('[data-oninput="salesSearch"]'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-oninput="recSearch"]')){ ui.recSearch = t.value; render(); const el=document.querySelector('[data-oninput="recSearch"]'); if(el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  if(t.matches('[data-recipe-batch-yield]')){
    // Réagit à chaque frappe (pas seulement en quittant le champ) pour que l'effet soit
    // immédiatement visible — re-render() recrée l'input, donc on lui redonne le focus ET
    // le curseur en fin de valeur (sinon Chrome le replace en début et "12" tapé au clavier
    // devient "21" une fois le 2e chiffre inséré avant le 1er).
    const rid = t.dataset.recipeBatchYield;
    const r = state.recipes.find(x=>x.id===rid);
    if(r){
      const raw = t.value;
      const v = parseNum(raw);
      r.batch_yield = (raw===''||isNaN(v)||v<=0) ? null : v;
      scheduleSave(); render();
      const el = document.querySelector(`[data-recipe-batch-yield="${rid}"]`);
      if(el){
        el.focus();
        try{
          const len = el.value.length;
          el.type = 'text';
          el.setSelectionRange(len, len);
          el.type = 'number';
        }catch(e){}
      }
    }
    return;
  }
});
document.addEventListener('change', function(e){
  const t = e.target;
  if(t.id==='recipe-photo-input'){
    const file = t.files && t.files[0];
    if(!file || !ui.photoTarget) return;
    const r = state.recipes.find(x=>x.id===ui.photoTarget);
    if(!r) return;
    setSaveIndicator('pending','Traitement de la photo…');
    compressImage(file, 1000, 0.72).then(dataUrl=>{
      r.photo = dataUrl;
      ui.photoTarget = null;
      scheduleSave(); render();
    }).catch(err=>{
      alert(err.message || 'Impossible de lire cette image.');
      setSaveIndicator('saved','À jour');
    });
    return;
  }
  if(t.matches('[data-onchange="lossInv"]')){ ui.lossInv = t.value; render(); return; }
  if(t.matches('[data-onchange="catFilter"]')){ ui.catFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="fournisseurFilter"]')){ ui.fournisseurFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="familyFilter"]')){ ui.familyFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="productSort"]')){ ui.productSort = t.value; render(); return; }
  if(t.matches('[data-onchange="marginSort"]')){ ui.marginSort = t.value; render(); return; }
  if(t.matches('[data-onchange="recipeFilter"]')){ ui.recipeFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="recipe-status"]')){
    const r = state.recipes.find(x=>x.id===t.dataset.rid);
    if(r){
      const newStatus = t.value;
      if(recipeStatus(r)!==newStatus){
        r.status = newStatus;
        r.active = newStatus!=='archived'; // champ historique conservé pour compatibilité
        state.recipe_status_log = state.recipe_status_log || [];
        state.recipe_status_log.push({ id: uid('log'), recipe_id: r.id, status: newStatus, date: todayISO() });
        scheduleSave();
      }
      render();
    }
    return;
  }
  if(t.matches('[data-onchange="historyFilter"]')){ ui.historyFilter = t.value; render(); return; }
  if(t.matches('[data-reception-unit]')){
    const pid = t.dataset.receptionUnit;
    const p = productById(pid);
    const e = recEntry(pid);
    e.qtyUnit = t.value;
    if(e.qtyRaw>0) e.qty = round3(e.qtyRaw * qtyFactor(p, e.qtyUnit));
    render();   // la ligne d'équivalence apparaît/disparaît : rendu complet assumé
    return;
  }
  if(t.matches('[data-reception-qty]') || t.matches('[data-reception-price]')){
    const isQty = !!t.dataset.receptionQty;
    const pid = isQty ? t.dataset.receptionQty : t.dataset.receptionPrice;
    const p = productById(pid);
    const v = parseNum(t.value);
    const e = recEntry(pid);
    if(isQty){
      if(isNaN(v) || v<=0){ delete e.qty; delete e.qtyRaw; }
      else {
        if(!e.qtyUnit) e.qtyUnit = qtyUnitOptions(p)[0].v;
        e.qtyRaw = v;
        e.qty = round3(v * qtyFactor(p, e.qtyUnit));
      }
    } else {
      if(isNaN(v) || v<=0) delete e.price; else e.price = v;
    }
    if(!recIsFilled(e)) delete ui.recDraft[pid];
    refreshReception(t);
    return;
  }
  if(t.matches('[data-sales-qty]')){
    const rid = t.dataset.salesQty;
    const v = Math.round(parseNum(t.value));
    ui.salesDraft = ui.salesDraft || {};
    if(isNaN(v) || v<=0) delete ui.salesDraft[rid]; else ui.salesDraft[rid] = v;
    // Le détail « ce qui va sortir » change de lignes : ici un rendu complet est
    // justifié, on ne peut pas patcher un tableau dont la composition varie.
    render();
    const back = document.querySelector(`[data-sales-qty="${rid}"]`);
    if(back){ back.focus(); back.setSelectionRange(back.value.length, back.value.length); }
    return;
  }
  if(t.matches('[data-onchange="salesDate"]')){ ui.salesDate = t.value; return; }
  if(t.matches('[data-onchange="salesCat"]')){ ui.salesCat = t.value; render(); return; }
  if(t.matches('[data-onchange="recDate"]')){ ui.recDate = t.value; return; }
  if(t.matches('[data-onchange="recCat"]')){ ui.recCat = t.value; render(); return; }
  if(t.matches('[data-onchange="recSupplier"]')){ ui.recSupplier = t.value; render(); return; }
  if(t.matches('[data-onchange="invGroupBy"]')){ ui.invGroupBy = t.value; render(); return; }
  if(t.matches('[data-onchange="stockCatFilter"]')){ ui.stockCatFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="stockFamilyFilter"]')){ ui.stockFamilyFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="stockZoneFilter"]')){ ui.stockZoneFilter = t.value; render(); return; }
  if(t.matches('[data-onchange="stockSort"]')){ ui.stockSort = t.value; render(); return; }
  if(t.matches('[data-inventory-count]')){
    const [invId, idx] = t.dataset.inventoryCount.split(':');
    const inv = (state.inventories||[]).find(x=>x.id===invId);
    if(!inv) return;
    const c = inv.counts[parseInt(idx,10)];
    const v = parseNum(t.value);
    c.counted_qty = isNaN(v)?null:v;
    scheduleSave();
    refreshInventoryRow(t, inv, c);
    return;
  }
  if(t.matches('[data-category-field]')){
    const c = categories()[parseInt(t.dataset.idx,10)];
    if(!c) return;
    const f = t.dataset.categoryField;
    if(f==='has_catalogue') c.has_catalogue = t.checked;
    else {
      const v = (t.value||'').trim();
      if(f==='label' && !v){ render(); return; }   // un nom vide rendrait la catégorie invisible
      c[f] = v;
    }
    scheduleSave(); render();
    return;
  }
  if(t.matches('[data-setting]')){
    const key = t.dataset.setting;
    let val = (t.type==='checkbox') ? t.checked : t.value;
    if(key==='establishment_name') val = String(val||'').trim() || 'Mon établissement';
    if(key==='margin_alert_pct') val = parseNum(val);
    if(key==='tva_rate_default') val = parseNum(val);
    state.settings[key] = val;
    scheduleSave(); render(); return;
  }
  if(t.matches('[data-catalog-price]')){
    const [rid, idx] = t.dataset.catalogPrice.split(':');
    const r = state.recipes.find(x=>x.id===rid);
    const ing = r.ingredients[parseInt(idx,10)];
    if(ing.product_id){
      const p = productById(ing.product_id);
      const newPrice = parseNum(t.value);
      if(!isNaN(newPrice)){
        let s = primarySupplier(p);
        if(!s){
          s = { id: uid('s'), name:'Fournisseur principal', history:[] };
          p.suppliers = p.suppliers || [];
          p.suppliers.push(s);
          p.primary_supplier_id = s.id;
        }
        s.history.push({date: todayISO(), price:newPrice, note:'Modifié depuis la carte '+r.name});
        scheduleSave(); render();
      }
    }
    return;
  }
  if(t.matches('[data-catalog-pv]')){
    const [rid, idx] = t.dataset.catalogPv.split(':');
    const r = state.recipes.find(x=>x.id===rid);
    const ing = r.ingredients[parseInt(idx,10)];
    const v = parseNum(t.value);
    ing.line_pv_ttc = isNaN(v)?null:v;
    scheduleSave(); render();
    return;
  }
  if(t.matches('[data-catalog-hh-pv]')){
    const [rid, idx] = t.dataset.catalogHhPv.split(':');
    const r = state.recipes.find(x=>x.id===rid);
    const ing = r.ingredients[parseInt(idx,10)];
    const v = parseNum(t.value);
    ing.line_happy_hour_pv_ttc = isNaN(v)?null:v;
    scheduleSave(); render();
    return;
  }
});

document.addEventListener('submit', function(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const fd = new FormData(form);

  if(kind==='add-supplier-price'){
    const p = productById(form.dataset.id);
    const s = p.suppliers.find(x=>x.id===form.dataset.sid);
    s.history.push({ date: fd.get('date')||todayISO(), price: parseNum(fd.get('price')), note: fd.get('note')||'' });
    s.history.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-supplier'){
    const p = productById(form.dataset.id);
    const s = { id: uid('s'), name: (fd.get('name')||'').trim() || 'Fournisseur', history: [
      { date: fd.get('date')||todayISO(), price: parseNum(fd.get('price')), note: fd.get('note')||'' }
    ] };
    p.suppliers = p.suppliers || [];
    p.suppliers.push(s);
    if(!p.primary_supplier_id) p.primary_supplier_id = s.id;
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='rename-supplier'){
    const p = productById(form.dataset.id);
    const s = p.suppliers.find(x=>x.id===form.dataset.sid);
    s.name = (fd.get('name')||'').trim() || s.name;
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-product'){
    const id = uid('p');
    const sid = uid('s');
    const fournisseur = (fd.get('fournisseur')||'').trim() || 'Fournisseur principal';
    const conv = readProductConversionFields(fd);
    const newProduct = { id, name: fd.get('name'), unit_label: fd.get('unit_label')||'', category: fd.get('category')||firstCategoryId(),
      suppliers: [{ id: sid, name: fournisseur, history:[{date:todayISO(), price: parseNum(fd.get('price')), note:'Création manuelle'}] }],
      primary_supplier_id: sid,
      family: conv.family, storage_zone: conv.storage_zone, base_unit: conv.base_unit, purchase_size: conv.purchase_size, unit_needs_review: conv.unit_needs_review,
      stock_qty: 0, stock_unit: conv.base_unit ? baseUnitLabel(conv.base_unit) : (fd.get('unit_label')||'unité'), stock_low_threshold: null, stock_movements: [] };
    state.products.push(newProduct);
    const invId = form.dataset.invContext;
    if(invId){
      const inv = (state.inventories||[]).find(x=>x.id===invId);
      if(inv && inv.status==='in_progress') inv.counts.push({ product_id:id, theoretical_qty:0, counted_qty:null });
      ui.invSearch = '';
    }
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='edit-product-meta'){
    const p = productById(form.dataset.id);
    p.name = fd.get('name'); p.unit_label = fd.get('unit_label')||''; p.category = fd.get('category');
    const conv = readProductConversionFields(fd);
    p.family = conv.family; p.storage_zone = conv.storage_zone;
    p.base_unit = conv.base_unit; p.purchase_size = conv.purchase_size; p.unit_needs_review = conv.unit_needs_review;
    if(conv.base_unit) p.stock_unit = baseUnitLabel(conv.base_unit);
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-recipe'){
    const cat = form.dataset.cat;
    const id = uid('r');
    const hhp = fd.get('happy_hour_price');
    const by = fd.get('batch_yield');
    state.recipes.push({ id, name: fd.get('name'), category: cat, type:'recette', date_iso: todayISO(),
      ingredients: [], pv_ttc: parseNum(fd.get('pv_ttc'))||0, tva_rate: parseNum(fd.get('tva_rate')),
      happy_hour_price: (hhp===''||hhp===null)?null:parseNum(hhp),
      batch_yield: (by===''||by==null)?null:parseNum(by),
      instructions: fd.get('instructions')||'', notes:'', allergens:[], needs_review:false });
    closeOverlay(); scheduleSave(); setView('recipe-detail', id);
  }
  else if(kind==='edit-recipe-meta'){
    const r = state.recipes.find(x=>x.id===form.dataset.id);
    const hhp = fd.get('happy_hour_price');
    // Le nombre de bouteilles/portions (batch_yield) n'est plus dans ce formulaire : il se
    // règle désormais via le champ inline sur la fiche elle-même (data-recipe-batch-yield),
    // pour ne pas l'écraser à chaque enregistrement d'un autre champ.
    r.name = fd.get('name'); r.pv_ttc = parseNum(fd.get('pv_ttc'))||0; r.tva_rate = parseNum(fd.get('tva_rate'));
    r.happy_hour_price = (hhp===''||hhp===null)?null:parseNum(hhp);
    r.instructions = fd.get('instructions')||''; r.notes = fd.get('notes')||'';
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='add-ingredient'){
    const r = state.recipes.find(x=>x.id===form.dataset.rid);
    let pid = fd.get('product_id') || null;
    const newName = (fd.get('new_name')||'').trim();
    let priceBase = null;
    if(!pid && newName){
      pid = uid('p');
      const sid = uid('s');
      const pr = parseNum(fd.get('pr'))||0;
      const fournisseur = (fd.get('fournisseur')||'').trim() || 'Fournisseur principal';
      state.products.push({ id:pid, name:newName, unit_label:'', category:r.category,
        suppliers:[{ id: sid, name: fournisseur, history:[{date:todayISO(), price: pr, note:'Créé depuis la fiche '+r.name}] }],
        primary_supplier_id: sid,
        stock_qty: 0, stock_unit: 'unité', stock_low_threshold: null, stock_movements: [] });
      priceBase = pr;
    } else if(pid){
      priceBase = currentPrice(productById(pid));
    }
    const prod = pid? productById(pid): null;
    r.ingredients.push({
      product_id: pid, display_name: prod? prod.name : newName || 'Ingrédient',
      qty: fd.get('qty')||'', unit:'', pr_base: parseNum(fd.get('pr'))||0,
      price_base: priceBase, weight_coeff: parseNum(fd.get('weight_coeff'))||1.1,
      line_pv_ttc:null, line_pv_ht:null,
    });
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='stock-movement'){
    const p = productById(form.dataset.id);
    const type = fd.get('type');
    let qty = parseNum(fd.get('qty'))||0;
    if(type==='perte'||type==='casse') qty = -Math.abs(qty);
    else if(type==='reception') qty = Math.abs(qty);
    addStockMovement(p, type, qty, fd.get('note')||'', fd.get('date')||todayISO());
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='stock-settings'){
    const p = productById(form.dataset.id);
    const newQty = parseNum(fd.get('stock_qty'));
    const oldQty = p.stock_qty||0;
    p.stock_unit = fd.get('stock_unit')||p.unit_label||'unité';
    const thr = fd.get('stock_low_threshold');
    p.stock_low_threshold = (thr===''||thr===null) ? null : parseNum(thr);
    if(!isNaN(newQty) && Math.abs(newQty-oldQty)>1e-9){
      addStockMovement(p, 'ajustement', round3(newQty-oldQty), fd.get('note')||'Réglage manuel du stock', todayISO());
    }
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='new-inventory'){
    const cat = fd.get('category');
    const zone = fd.get('zone') || 'all';
    const id = uid('inv');
    // Pré-remplissage : la fiche contient d'emblée tous les produits concernés, avec le
    // stock théorique figé au moment de la création. Les lignes laissées vides sont
    // ignorées à la validation, donc lister large ne fausse rien.
    const counts = fd.get('start_mode')==='empty' ? [] :
      productsForInventory(cat, zone).map(p=>({ product_id:p.id, theoretical_qty: p.stock_qty||0, counted_qty:null }));
    state.inventories = state.inventories || [];
    state.inventories.push({
      id, date: fd.get('date')||todayISO(), category: cat, zone, status:'in_progress',
      created_at: todayISO(), validated_at: null,
      counts
    });
    ui.invSearch = '';
    closeOverlay(); scheduleSave(); setView('inventory-detail', id);
  }
  else if(kind==='edit-ingredient'){
    const r = state.recipes.find(x=>x.id===form.dataset.rid);
    const idx = parseInt(form.dataset.idx,10);
    const ing = r.ingredients[idx];
    ing.display_name = fd.get('display_name');
    ing.qty = fd.get('qty')||'';
    ing.pr_base = parseNum(fd.get('pr_base'))||0;
    ing.weight_coeff = parseNum(fd.get('weight_coeff'))||1;
    if(ing.product_id){ ing.price_base = currentPrice(productById(ing.product_id)); }
    closeOverlay(); scheduleSave(); render();
  }
  else if(kind==='review-yield'){
    const r = state.recipes.find(x=>x.id===form.dataset.id);
    const n = parseNum(fd.get('yield'));
    if(r && n>0){
      r.batch_yield = n;
      r.is_batch_recipe = true;
      // Les anciens facteurs de correction deviendraient un double comptage.
      r.batch_correction_pr = null; r.batch_correction_prp = null;
      scheduleSave();
    }
    render();
  }
  else if(kind==='review-format'){
    const p = productById(form.dataset.id);
    const size = parseNum(fd.get('size'));
    const unit = fd.get('unit');
    if(p && size>0 && unit){
      p.base_unit = unit;
      p.purchase_size = size;
      p.unit_needs_review = false;
      p.format_confirmed = true;
      p.stock_unit = baseUnitLabel(unit);
      scheduleSave();
    }
    render();
  }
  else if(kind==='add-category'){
    const label = (fd.get('label')||'').trim();
    if(label){
      // L'identifiant est dérivé du nom mais ne changera jamais : c'est lui que
      // portent les produits et les fiches. Renommer la catégorie reste sans risque.
      const base = label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'categorie';
      let id = base, n = 2;
      while(categories().some(c=>c.id===id)) id = base + '-' + (n++);
      state.settings.categories.push({id, label, ico:'▤', recipes_label:'Fiches '+label.toLowerCase(), has_catalogue:false, catalogue_label:''});
      scheduleSave();
    }
    render();
  }
  else if(kind==='add-storage-zone'){
    const name = (fd.get('zone')||'').trim();
    if(name){
      state.settings.storage_zones = state.settings.storage_zones || [];
      if(!state.settings.storage_zones.some(z=>z.toLowerCase()===name.toLowerCase())){
        state.settings.storage_zones.push(name);
        scheduleSave();
      }
      render();
    }
  }
});

document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeOverlay(); closeMobileNav(); } });

// Bouton Précédent/Suivant du navigateur, ou adresse tapée à la main.
window.addEventListener('hashchange', function(){
  if(suppressHashChange){ suppressHashChange = false; return; }
  const target = hashToView();
  if(!target) return;
  if(target.view!=='inventory-detail') ui.invSearch = '';
  ui.view = target.view; ui.id = target.id;
  closeOverlay(); closeMobileNav();
  render();
});

/* ================= Boot ================= */
async function boot(){
  if(!SUPABASE_URL || SUPABASE_URL.indexOf('__') === 0){
    document.getElementById('app').innerHTML =
      '<div class="card empty"><div class="big">⚙</div><h3>Application non configurée</h3>'
      + '<p>L’adresse de la base de données n’a pas été renseignée au moment de la construction du fichier.</p></div>';
    return;
  }
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  await ensureSignedIn();     // qui êtes-vous ?
  await ensureCompany();      // dans quel établissement ?

  let loaded = null;
  try{
    loaded = await loadInitialState();
  }catch(err){
    console.error(err);
    document.getElementById('app').innerHTML =
      '<div class="card empty"><div class="big">⚠</div><h3>Connexion impossible</h3>'
      + '<p>Impossible de joindre la base de données. Vérifiez la connexion internet, puis rechargez la page.</p></div>';
    setSaveIndicator('error','Hors ligne');
    return;
  }

  // Un établissement qui s'inscrit démarre SUR SA PROPRE PAGE BLANCHE. Lui
  // installer les produits d'un autre restaurant l'obligerait à tout effacer
  // avant de commencer — et alourdirait le fichier de 534 Ko pour rien.
  const premierLancement = !loaded;
  state = loaded || { meta:{}, settings:{}, products:[], recipes:[], inventories:[], salesLog:[] };
  migrateState();
  // Le nom saisi à la création de l'établissement fait foi.
  if(sbCompany && sbCompany.name) state.settings.establishment_name = sbCompany.name;

  if(premierLancement && !sbReadOnly){
    try{ await seedSupabase(state); }
    catch(err){ console.error(err); setSaveIndicator('error','Installation incomplète — rechargez la page'); }
  } else if(sbReadOnly){
    setSaveIndicator('readonly','Hors ligne — dernière copie de cet appareil');
  } else {
    setSaveIndicator('saved','À jour');
  }

  if(!sbReadOnly) watchRemoteChanges();

  const start = hashToView();
  if(start){ ui.view = start.view; ui.id = start.id; }
  render();
  if(needsOnboarding()) showOnboarding(0);
}

boot();

})();
</script>
